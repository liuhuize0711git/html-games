  }
  function openRest() {
    const p = state.player;
    state.pending = {
      kind: "rest", title: "休息处",
      text: "你在营火旁坐下。生命 " + p.hp + "/" + p.maxHp + "，金币 " + p.gold + "。",
      options: [
        { label: "休息", hint: "回复 " + Math.max(1, Math.floor(p.maxHp * 3 / 10)) + " 点生命", act: "heal" },
        { label: "锻造", hint: "升级一张卡牌", act: "forge" },
        { label: "冥想", hint: "移除一张卡牌（最大生命 -2）", act: "meditate" },
        { label: "离开", hint: "什么也不做", act: "leave" }
      ]
    };
    state.screen = "node";
  }
  function openTreasure() {
    state.pending = {
      kind: "treasure", title: "宝箱", text: "一个镶着铁边的箱子静静躺在角落。",
      options: [
        { label: "打开箱子", hint: "获得一件遗物与一瓶药水", act: "open" },
        { label: "撬下箱盖上的金饰", hint: "获得 75 金币", act: "gold" },
        { label: "什么都不做", hint: "直接离开", act: "leave" }
      ]
    };
    state.screen = "node";
  }
  function priceForRarity(r) {
    if (r === "common") return randInt(45, 60);
    if (r === "uncommon") return randInt(68, 85);
    if (r === "rare") return randInt(110, 135);
    return 50;
  }
  function openShop() {
    savedShop = null;
    const stock = { cards: [], potions: [], relic: randomRelic(), relicSold: false, removalUsed: false, healUsed: false };
    const seen = {};
    for (let i = 0; i < 3; i++) {
      let id = randomGainableCard();
      let guard = 0;
      while (id >= 0 && seen[id] && guard++ < 30) id = randomGainableCard();
      if (id < 0) continue;
      seen[id] = 1;
      stock.cards.push({ id: id, up: 0, price: priceForRarity(CARDS[id].r), sold: false });
    }
    for (let i = 0; i < 2; i++) {
      const id = randomPotionId();
      stock.potions.push({ id: id, price: POTIONS[id].p, sold: false });
    }
    state.pending = { kind: "shop", title: "商店", text: "金币 " + state.player.gold, stock: stock, options: [{ label: "离开商店", act: "leave" }] };
    state.screen = "node";
  }
  function shopBuy(type, i) {
    const p = state.player, st = state.pending && state.pending.stock;
    if (!st) return { ok: false, fx: [], msg: "不在商店里" };
    let price = 0;
    if (type === "card") {
      const item = st.cards[i];
      if (!item || item.sold) return { ok: false, fx: [] };
      price = item.price;
      if (p.gold < price) { pushLog("金币不足。", "red"); return { ok: false, fx: [] }; }
      p.gold -= price; item.sold = true;
      p.deck.push({ id: item.id, up: 0 });
      pushLog("购买了 " + CARDS[item.id].n + "。", "green");
    } else if (type === "potion") {
      const item = st.potions[i];
      if (!item || item.sold) return { ok: false, fx: [] };
      price = item.price;
      if (p.gold < price) { pushLog("金币不足。", "red"); return { ok: false, fx: [] }; }
      if (!addPotion(item.id)) { pushLog("药水带已满。", "red"); return { ok: false, fx: [] }; }
      p.gold -= price; item.sold = true;
      pushLog("购买了 " + POTIONS[item.id].n + "。", "green");
    } else if (type === "relic") {
      if (st.relic < 0 || st.relicSold) return { ok: false, fx: [] };
      price = RELICS[st.relic].p;
      if (p.gold < price) { pushLog("金币不足。", "red"); return { ok: false, fx: [] }; }
      p.gold -= price; addRelic(st.relic); st.relicSold = true;
      pushLog("购买了遗物 " + RELICS[st.relic].n + "。", "gold");
    } else if (type === "remove") {
      if (st.removalUsed) return { ok: false, fx: [] };
      if (p.gold < 75) { pushLog("金币不足（需要 75）。", "red"); return { ok: false, fx: [] }; }
      savedShop = state.pending;      /* 删牌结束后回到同一个商店 */
      openPick("remove", "shopRemove");
      return { ok: true, fx: [] };
    } else if (type === "heal") {
      if (st.healUsed) return { ok: false, fx: [] };
      if (p.gold < 40) { pushLog("金币不足（需要 40）。", "red"); return { ok: false, fx: [] }; }
      p.gold -= 40; st.healUsed = true;
      const before = p.hp;
      healPlayer(15);
      pushLog("回复了 " + (p.hp - before) + " 点生命。", "green");
    }
    state.pending.text = "金币 " + p.gold;
    return { ok: true, fx: [] };
  }
  function openEvent(id) {
    const ev = (id == null) ? rand(EVENTS.length) : id;
    const e = EVENTS[ev];
    state.pending = { kind: "event", eventId: ev, title: e.title, text: e.text, options: e.options.slice(), after: "finish" };
    state.screen = "node";
  }
  /* 升级：升级后有变化的牌才能升级 */
  function canUpgrade(c) {
    const def = cardDef(c);
    if (c.up) return false;
    if (!def.up) return false;
    if (def.desc && def.descUp) return def.descUp !== def.desc;
    return true;
  }
  function openPick(mode, from) {
    const p = state.player;
    const picks = [];
    p.deck.forEach(function (c, i) {
      const lab = cardLabel(c);
      lab.index = i;
      const kw = cardKeywords(c);
      if (mode === "upgrade") {
        lab.disabled = !canUpgrade(c);
        lab.tag = c.up ? "已升级" : (canUpgrade(c) ? "可升级" : "不可升级");
      } else {
        lab.disabled = !!(kw & KW.ETERNAL);
        lab.tag = (kw & KW.ETERNAL) ? "永恒" : "可移除";
      }
      picks.push(lab);
    });
    state.pending = {
      kind: "pick", mode: mode, from: from || "finish",
      title: mode === "upgrade" ? "选择要升级的卡牌" : "选择要移除的卡牌",
      text: "牌组共 " + p.deck.length + " 张。永恒牌无法被移除，已升级的牌无法再次升级。",
      picks: picks,
      options: [{ label: "取消", act: "cancel" }]
    };
    state.screen = "node";
  }

  /* ---------------- 选项分发 ---------------- */
  function finishNode() {
    state.battle = null;
    state.pending = null;
    state.floor++;
    if (state.floor > state.maxFloor) { state.result = "win"; state.screen = "over"; clearSave(); return; }
    generateChoices();
    state.screen = "map";
    save();
  }
  function backToPending() {
    const from = state.pending && state.pending.from;
    if (from === "rest") { openRest(); return; }
    if (from === "event" && state.pending.eventId != null) { openEvent(state.pending.eventId); return; }
    if (from === "shopRemove" && savedShop) { state.pending = savedShop; state.screen = "node"; return; }
    finishNode();
  }
  function chooseOption(i) {
    const pd = state.pending;
    if (!pd) return { ok: false, fx: [], msg: "当前没有可选的选项" };
    const opt = pd.options[i];
    if (!opt) return { ok: false, fx: [], msg: "没有这个选项" };
    if (opt.disabled) return { ok: false, fx: [], msg: "这个选项暂时不可用" };
    if (pd.kind === "reward" || pd.kind === "pick") {
      if (pd.kind === "pick" && opt.act === "cancel") { backToPending(); return { ok: true, fx: [] }; }
      finishNode();
      return { ok: true, fx: [] };
    }
    if (pd.kind === "rest") {
      const p = state.player;
      if (opt.act === "heal") {
        const before = p.hp;
        healPlayer(Math.max(1, Math.floor(p.maxHp * 3 / 10)));
        pushLog("你回复了 " + (p.hp - before) + " 点生命。", "green");
        finishNode(); return { ok: true, fx: [] };
      }
      if (opt.act === "forge") { openPick("upgrade", "rest"); return { ok: true, fx: [] }; }
      if (opt.act === "meditate") { openPick("remove", "rest"); return { ok: true, fx: [] }; }
      finishNode(); return { ok: true, fx: [] };
    }
    if (pd.kind === "treasure") {
      if (opt.act === "open") { gainRelicLog(); gainRandomPotion(); }
      else if (opt.act === "gold") { state.player.gold += 75; pushLog("获得 75 枚金币。", "gold"); }
      finishNode(); return { ok: true, fx: [] };
    }
    if (pd.kind === "shop") { finishNode(); return { ok: true, fx: [] }; }
    if (pd.kind === "event") {
      const p = state.player;
      switch (opt.act) {
        case "loseRare":
          p.hp = Math.max(1, p.hp - 6);
          pushLog("你失去了 6 点生命。", "red");
          gainRandomCard("rare"); finishNode(); break;
        case "gold40": p.gold += 40; pushLog("获得 40 枚金币。", "gold"); finishNode(); break;
        case "buyRelic":
          if (p.gold < 60) { pushLog("金币不足（需要 60）。", "red"); return { ok: false, fx: [] }; }
          p.gold -= 60; gainRelicLog(); finishNode(); break;
        case "gamble":
          if (p.gold < 50) { pushLog("金币不足（需要 50）。", "red"); return { ok: false, fx: [] }; }
          p.gold -= 50;
          if (chance(50)) { p.gold += 150; pushLog("你赢了！获得 150 枚金币（现有 " + p.gold + "）。", "green"); }
          else pushLog("你输了，50 枚金币被收走了（现有 " + p.gold + "）。", "red");
          finishNode(); break;
        case "sacrifice": {
          p.maxHp = Math.max(1, p.maxHp - 4);
          if (p.hp > p.maxHp) p.hp = p.maxHp;
          pushLog("最大生命 -4（现在 " + p.hp + "/" + p.maxHp + "）。", "red");
          gainRandomPotion(); gainRandomPotion(); finishNode(); break;
        }
        case "pray": { const before = p.hp; healPlayer(12); pushLog("回复了 " + (p.hp - before) + " 点生命。", "green"); finishNode(); break; }
        case "forge": openPick("upgrade", "event"); return { ok: true, fx: [] };
        case "gold30": p.gold += 30; pushLog("获得 30 枚金币。", "gold"); finishNode(); break;
        case "listen": healPlayer(10); p.gold += 20; pushLog("回复 10 点生命，获得 20 枚金币。", "green"); finishNode(); break;
        case "carve": openPick("remove", "event"); return { ok: true, fx: [] };
        default: finishNode(); break;
      }
      return { ok: true, fx: [] };
    }
    return { ok: false, fx: [], msg: "未知的选项" };
  }
  function pick(i) {
    const pd = state.pending;
    if (!pd || (pd.kind !== "pick" && pd.kind !== "reward")) return { ok: false, fx: [], msg: "现在不能选牌" };
    if (pd.kind === "reward") {
      const lab = pd.picks[i];
      if (!lab) return { ok: false, fx: [], msg: "没有这张卡" };
      state.player.deck.push({ id: lab.id, up: lab.up ? 1 : 0 });
      pushLog(lab.name + " 已加入牌组。", "green");
      finishNode();
      return { ok: true, fx: [] };
    }
    const lab = pd.picks[i];
    if (!lab || lab.disabled) return { ok: false, fx: [], msg: "这张牌不能选" };
    const idx = lab.index;
    if (pd.mode === "upgrade") {
      state.player.deck[idx].up = 1;
      pushLog("升级完成：" + cardName(state.player.deck[idx]) + "。", "green");
    } else {
      const nm = cardName(state.player.deck[idx]);
      state.player.deck.splice(idx, 1);
      pushLog(nm + " 已从牌组中移除。", "green");
      if (pd.from === "rest") {
        state.player.maxHp = Math.max(1, state.player.maxHp - 2);
        if (state.player.hp > state.player.maxHp) state.player.hp = state.player.maxHp;
        pushLog("最大生命 -2。", "dim");
      } else if (pd.from === "event") {
        state.player.maxHp = Math.max(1, state.player.maxHp - 3);
        if (state.player.hp > state.player.maxHp) state.player.hp = state.player.maxHp;
        pushLog("最大生命 -3。", "dim");
      }
    }
    if (pd.from === "shopRemove") {
      if (savedShop) {
        state.pending = savedShop;
        state.pending.stock.removalUsed = true;
        state.screen = "node";
      } else {
        openShop();
        state.pending.stock.removalUsed = true;
      }
      state.player.gold -= 75;
      savedShop = null;
      return { ok: true, fx: [] };
    }
    finishNode();
    return { ok: true, fx: [] };
  }

  /* ---------------- 冒险流程 ---------------- */
  function enterNode(type) {
    state.pending = null;
    if (type === NODE.BATTLE) return startBattle(0);
    if (type === NODE.ELITE) return startBattle(1);
    if (type === NODE.BOSS) return startBattle(2);
    if (type === NODE.REST) openRest();
    else if (type === NODE.SHOP) openShop();
    else if (type === NODE.TREASURE) openTreasure();
    else openEvent();
    return [];
  }
  function choose(i) {
    if (!state) return { ok: false, fx: [], msg: "还没有开始冒险" };
    if (state.screen === "map") {
      const t = state.choices[i];
      if (t == null) return { ok: false, fx: [], msg: "没有这个选项" };
      const fx = enterNode(t);
      return { ok: true, fx: fx || [] };
    }
    if (state.screen === "node") return chooseOption(i);
    return { ok: false, fx: [], msg: "现在不能选择" };
  }
  function newRun(charId, seed) {
    if (!(charId >= 0 && charId < CHARS.length)) charId = 0;
    seed = (seed >>> 0) || ((Date.now() ^ (Math.random() * 0xffffffff)) >>> 0);
    seedRng(seed);
    const ch = CHARS[charId];
    const maxHp = ch.hp;
    state = {
      screen: "map", charId: charId, seed: seed, floor: 1, maxFloor: 15,
      player: { name: ch.name, charId: charId, hp: maxHp, maxHp: maxHp, gold: 99,
                deck: starterDeck(charId), relics: [], potions: [-1, -1, -1] },
      choices: [], battle: null, pending: null, log: [], result: null
    };
    addRelic(ch.relic);
    state.player.potions[0] = ch.potion;
    generateChoices();
    pushLog("新的冒险开始（种子 " + seed + "）。", "gold");
    save();
    return view();
  }

  /* ---------------- 视图（给界面用） ---------------- */
  function view() {
    if (!state) return { screen: "menu" };
    const p = state.player;
    const v = {
      screen: state.screen, floor: state.floor, maxFloor: state.maxFloor, seed: state.seed,
      charId: state.charId, result: state.result,
      player: {
        name: p.name, hp: p.hp, maxHp: p.maxHp, gold: p.gold, deckCount: p.deck.length,
        relics: p.relics.map(function (id) { return { id: id, n: RELICS[id].n, d: RELICS[id].d }; }),
        potions: p.potions.map(function (id) { return id >= 0 ? { id: id, n: POTIONS[id].n, d: POTIONS[id].d } : null; }),
        deck: p.deck.map(cardLabel)
      },
      choices: state.choices.map(function (t) { return { type: t, n: NODE_INFO[t].n, d: NODE_INFO[t].d }; }),
      log: state.log.slice(-8)
    };
    if (state.battle) {
      const b = state.battle;
      v.battle = {
        turn: b.turn, energy: b.energy, energyMax: b.energyMax, block: b.pblock, st: b.pst,
        over: b.over, elite: b.elite, boss: b.boss,
        star: b.star, forge: b.forge, focus: b.focus,
        minion: b.minion, minionMax: b.minionMax,
        temp: { str: b.tempStr, dex: b.tempDex, focus: b.tempFocus, block: b.tempBlock },
        orbs: b.orbs.slice(0, b.orbSlots), orbSlots: b.orbSlots,
        retainHand: b.retainHand, freePlay: b.freePlay, skillsFree: b.skillsFree,
        hand: b.hand.map(function (c, i) {
          const lab = cardLabel(c);
          lab.handIndex = i;
          lab.playable = !(cardKeywords(c) & KW.UNPLAYABLE) &&
            cardPlayCost(c, b.energy) <= b.energy &&
            (lab.starCost | 0) <= b.star &&
            !(b.sel && b.sel.active);
          return lab;
        }),
        enemies: b.enemies.map(function (e, i) {
          return { index: i, defId: e.defId, name: ENEMIES[e.defId].n, hp: e.hp, maxHp: e.maxHp,
                   block: e.block, dead: !e.alive, st: e.st, intent: enemyIntent(e),
                   elite: !!ENEMIES[e.defId].elite, boss: !!ENEMIES[e.defId].boss };
        }),
        drawCount: b.draw.length, discardCount: b.discard.length, exhaustCount: b.exhaust.length,
        sel: null
      };
      if (b.sel && b.sel.active) {
        const pile = selPileRef(b, b.sel.pile);
        let opName = "选择";
        if (b.sel.op === SEL_OP.DISCARD) opName = "弃置";
        else if (b.sel.op === SEL_OP.EXHAUST) opName = "消耗";
        else if (b.sel.op === SEL_OP.DRAW_TOP) opName = "放到抽牌堆顶";
        else if (b.sel.op === SEL_OP.PLAY) opName = "免费打出";
        else if (b.sel.op === SEL_OP.ADD_HAND) opName = "拿进手牌";
        v.battle.sel = {
          active: true, pile: b.sel.pile, pileName: selPileName(b.sel.pile), op: b.sel.op,
          opName: opName, count: b.sel.count, times: b.sel.times,
          pool: b.sel.pool.map(function (pileIdx, k) {
            const lab = cardLabel(pile[pileIdx]);
            lab.pickIndex = k;
            return lab;
          })
        };
      }
    }
    if (state.pending) v.pending = state.pending;
    return v;
  }

  /* ---------------- 存档 ---------------- */
  function save() {
    try {
      if (typeof localStorage === "undefined") return false;
      localStorage.setItem("spire_save", JSON.stringify({ v: 2, state: state, rng: rngState }));
      return true;
    } catch (e) { return false; }
  }
  function load() {
    try {
      if (typeof localStorage === "undefined") return false;
      const raw = localStorage.getItem("spire_save");
      if (!raw) return false;
      const obj = JSON.parse(raw);
      if (!obj || !obj.state || !obj.state.player) return false;
      state = obj.state;
      state.log = state.log || [];
      state.choices = state.choices || [];
      rngState = obj.rng || 1;
      return true;
    } catch (e) { return false; }
  }
  function hasSave() {
    try { return typeof localStorage !== "undefined" && !!localStorage.getItem("spire_save"); }
    catch (e) { return false; }
  }
  function clearSave() {
    try { if (typeof localStorage !== "undefined") localStorage.removeItem("spire_save"); } catch (e) {}
  }
  function toMenu() {
    if (state) state.screen = "menu";
    return view();
  }

  /* ---------------- 自测辅助（自动化测试用） ---------------- */
  function invariantErrors() {
    const errs = [];
    if (!state) return errs;
    const p = state.player;
    if (p.hp < 0) errs.push("玩家生命为负");
    if (p.hp > p.maxHp) errs.push("玩家生命超过上限");
    if (p.maxHp < 1) errs.push("生命上限过小");
    if (p.gold < 0) errs.push("金币为负");
    if (p.deck.length < 1 || p.deck.length > 300) errs.push("牌组张数异常");
    p.deck.forEach(function (c) {
      if (!CARDS[c.id]) errs.push("非法卡牌编号");
      if (c.up !== 0 && c.up !== 1) errs.push("非法升级标记");
    });
    p.relics.forEach(function (id) { if (!RELICS[id]) errs.push("非法遗物"); });
    p.potions.forEach(function (id) { if (id !== -1 && !POTIONS[id]) errs.push("非法药水"); });
    if (state.battle) {
      const b = state.battle;
      b.enemies.forEach(function (e) {
        if (e.hp < 0 || e.hp > e.maxHp) errs.push("敌人生命异常");
        if (!ENEMIES[e.defId]) errs.push("非法敌人");
      });
      if (b.pblock < 0) errs.push("玩家格挡为负");
      if (b.energy < 0) errs.push("能量为负");
      if (b.star < 0) errs.push("星费为负");
      if (b.minion < 0 || b.minion > b.minionMax) errs.push("随从生命异常");
      if (b.orbSlots < 1 || b.orbSlots > MAX_ORBS) errs.push("充能球槽位异常");
      if (b.orbs.length < b.orbSlots) errs.push("充能球数组过短");
      for (let i = 0; i < b.orbSlots; i++) {
        if (b.orbs[i] < 0 || b.orbs[i] > 5) errs.push("非法充能球类型");
      }
      if (b.hand.length > MAX_HAND) errs.push("手牌超过上限");
      const total = b.draw.length + b.hand.length + b.discard.length + b.exhaust.length;
      if (total > 300) errs.push("战斗内牌数异常");
    }
    return errs;
  }
  function playRandom(maxSteps) {
    for (let s = 0; s < maxSteps; s++) {
      if (!state || state.screen === "over") break;
      if (state.screen === "battle") {
        const b = state.battle;
        if (b.over) break;
        if (b.sel && b.sel.active) {
          if (chance(85)) selPick(rand(b.sel.pool.length));
          else selCancel();
          continue;
        }
        const playable = [];
        b.hand.forEach(function (c, i) {
          if (cardKeywords(c) & KW.UNPLAYABLE) return;
          if (cardPlayCost(c, b.energy) > b.energy) return;
          if ((cardStats(c).starCost | 0) > b.star) return;
          playable.push(i);
        });
        if (playable.length && chance(80)) {
          const idx = pickOne(playable);
          const st = cardStats(b.hand[idx]);
          playCard(idx, cardNeedsTarget(st) ? firstAlive() : -1);
        } else endTurn();
      } else if (state.screen === "map") {
        choose(rand(state.choices.length));
      } else if (state.screen === "node") {
        const pd = state.pending;
        if (pd && pd.picks && pd.picks.length && chance(60)) {
          const okIdx = [];
          pd.picks.forEach(function (x, i) { if (!x.disabled) okIdx.push(i); });
          if (okIdx.length) pick(pickOne(okIdx));
          else choose(rand(pd.options.length));
        } else if (pd && pd.options && pd.options.length) {
          choose(rand(pd.options.length));
        } else finishNode();
      } else break;
    }
    return view();
  }

  const API = {
    newRun: newRun, load: load, save: save, hasSave: hasSave, clearSave: clearSave,
    toMenu: toMenu, view: view, choose: choose, pick: pick, playCard: playCard, endTurn: endTurn,
    usePotion: usePotion, dropPotion: dropPotion, shopBuy: shopBuy, selPick: selPick, selCancel: selCancel,
    cardLabel: cardLabel, cardDesc: cardDesc, cardStats: cardStats, cardCost: cardCost,
    canBeGained: canBeGained, canUpgrade: canUpgrade,
    needsTarget: function (card) { return cardNeedsTarget(cardStats(card)); },
    enemyIntent: enemyIntent,
    CARDS: CARDS, ENEMIES: ENEMIES, RELICS: RELICS, POTIONS: POTIONS, EVENTS: EVENTS,
    NODE_INFO: NODE_INFO, CHAR_NAME: CHAR_NAME, CHARS: CHARS, NODE: NODE,
    ORB: ORB, ORB_NAME: ORB_NAME, ORB_COLOR: ORB_COLOR, KW: KW, KW_NAME: KW_NAME,
    _test: {
      playRandom: playRandom, invariants: invariantErrors,
      seedRng: seedRng, getState: function () { return state; },
      setState: function (s) { state = s; },
      godMode: function (hp) { state.player.maxHp = hp; state.player.hp = hp; },
      pushDeck: function (id, up) { state.player.deck.push({ id: id, up: up || 0 }); },
      randomGainableCard: randomGainableCard, randomCardOfRarity: randomCardOfRarity
    }
  };
  if (typeof module !== "undefined" && module.exports) module.exports = API;
  return API;
})();
/* ==== ENGINE END ==== */
</script>

<script>
/* =====================================================================
 *  界面层：渲染 + 点击操作 + 动作动画
 *  充能球 / 随从（大脚）/ 君王之剑 都有专门的动画
 * ===================================================================== */
(function () {
  "use strict";
  const E = Engine;
  const $ = function (id) { return document.getElementById(id); };
  let busy = false;          /* 动画播放中禁止操作 */
  let speed = 1;             /* 1 = 正常，0.5 = 快，0 = 关闭动画 */
  let targetMode = null;     /* 已选中需要指定目标的卡牌下标；或 {potion:槽位} */
  let menuMode = "root";
  const disp = { pHp: 0, pMax: 1, pBlock: 0, eHp: [], eMax: [], eBlock: [], energy: 0, energyMax: 3 };

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, speed ? ms * speed : 0); }); }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

  /* ---------------- SVG 小人 ---------------- */
  function el(tag, a) {
    return "<" + tag + " " + Object.keys(a).map(function (k) { return k + '="' + a[k] + '"'; }).join(" ") + "/>";
  }
  function circle(cx, cy, r, f, s, w) { return el("circle", { cx: cx, cy: cy, r: r, fill: f || "none", stroke: s || "none", "stroke-width": w || 2 }); }
  function rect(x, y, w, h, f, s, rx) { return el("rect", { x: x, y: y, width: w, height: h, rx: rx || 3, fill: f, stroke: s || "none", "stroke-width": 2 }); }
  function poly(pts, f, s) { return el("polygon", { points: pts, fill: f, stroke: s || "none", "stroke-width": 2, "stroke-linejoin": "round" }); }
  function line(x1, y1, x2, y2, s, w) { return el("line", { x1: x1, y1: y1, x2: x2, y2: y2, stroke: s, "stroke-width": w || 3, "stroke-linecap": "round" }); }
  function path(d, f, s, w) { return el("path", { d: d, fill: f || "none", stroke: s || "none", "stroke-width": w || 2, "stroke-linejoin": "round", "stroke-linecap": "round" }); }
  function wrap(inner, w, h) {
    return '<svg width="' + (w || 96) + '" height="' + (h || 104) + '" viewBox="0 0 100 110">' +
      circle(50, 105, 22, "rgba(0,0,0,.35)") + inner + "</svg>";
  }
  function svgPlayer(charId) {
    const PAL = [
      { main: "#3a4762", trim: "#8fa6c8", acc: "#cfe9e0" },
      { main: "#3f5a5a", trim: "#7ad0c0", acc: "#dfe7f5" },

  /* ---------------- 渲染 ---------------- */
  function statusChips(st, dead) {
    const out = [];
    if (dead) return "";
    if (st.str) out.push('<span class="st str">力量 ' + st.str + "</span>");
    if (st.dex) out.push('<span class="st other">敏捷 ' + st.dex + "</span>");
    if (st.vuln) out.push('<span class="st vuln">易伤 ' + st.vuln + "</span>");
    if (st.weak) out.push('<span class="st weak">虚弱 ' + st.weak + "</span>");
    if (st.frail) out.push('<span class="st weak">无力 ' + st.frail + "</span>");
    if (st.poison) out.push('<span class="st poison">中毒 ' + st.poison + "</span>");
    if (st.thorns) out.push('<span class="st other">荆棘 ' + st.thorns + "</span>");
    if (st.plating) out.push('<span class="st plating">镀甲 ' + st.plating + "</span>");
    if (st.doom) out.push('<span class="st doom">恶兆 ' + st.doom + "</span>");
    if (st.regen) out.push('<span class="st other">再生 ' + st.regen + "</span>");
    return out.join("");
  }
  function typeClass(t) {
    if (t === "攻击") return "attack";
    if (t === "技能") return "skill";
    if (t === "能力") return "power";
    return "";
  }
  function cardHtml(c, dataAttr) {
    const cls = "card " + typeClass(c.type) + (c.playable === false ? " no" : "") + (c.upgraded ? " up" : "");
    const cost = c.costX ? "X" : c.cost;
    const sc = (c.starCost | 0) > 0 ? '<div class="scost" title="星费">★' + c.starCost + "</div>" : "";
    const kw = (c.keywords && c.keywords.length) ? '<div class="ckw">' + esc(c.keywords.join(" · ")) + "</div>" : "";
    const tag = c.tag ? '<div class="ctag">' + esc(c.tag) + "</div>" : "";
    return '<div class="' + cls + '" ' + (dataAttr || "") + ">" +
      '<div class="cost">' + cost + "</div>" + sc +
      '<div class="cname">' + esc(c.name) + "</div>" +
      '<div class="ctype">' + esc(c.type || "") + (c.rarity ? " · " + esc(c.rarity) : "") + "</div>" +
      '<div class="cdesc">' + esc(c.desc) + "</div>" + kw + tag + "</div>";
  }
  function orbHtml(orbs) {
    let h = "";
    for (let i = 0; i < orbs.length; i++) {
      const t = orbs[i];
      if (t) {
        h += '<div class="orbSlot filled" data-slot="' + i + '" style="background:' + E.ORB_COLOR[t] +
             '" title="' + E.ORB_NAME[t] + '">' + E.ORB_NAME[t].charAt(0) + "</div>";
      } else {
        h += '<div class="orbSlot" data-slot="' + i + '">·</div>';
      }
    }
    return h;
  }
  function showScreen(name) {
    ["menu", "char", "map", "battle", "node", "over"].forEach(function (s) {
      $("screen-" + s).classList.toggle("hidden", s !== name);
    });
  }
  function updateTop(v) {
    if (v.screen === "menu" || v.screen === "char") {
      $("tFloor").textContent = "尖塔行者";

      $("progressFill").style.width = "0%";
      $("tGold").textContent = "";
      $("tRelics").textContent = "";

    }
    const kind = v.battle ? (v.battle.boss ? "首领战" : (v.battle.elite ? "精英战" : "战斗"))
      : (v.screen === "map" ? "地图" : "");
    $("tFloor").textContent = "第 " + v.floor + " / " + v.maxFloor + " 层";
    $("tKind").textContent = kind;
    $("progressFill").style.width = Math.round(v.floor / v.maxFloor * 100) + "%";
    $("tGold").textContent = "金币 " + v.player.gold;
    $("tRelics").textContent = "遗物 " + v.player.relics.length + " 件";
  }
  function renderLog(v) {
    $("log").innerHTML = (v.log || []).map(function (l) {
      return '<div class="' + (l.cls || "") + '">' + esc(l.text) + "</div>";
    }).join("");
    $("log").scrollTop = $("log").scrollHeight;

  function appendLog(text, cls) {
    const d = document.createElement("div");
    d.className = cls || "";

    box.appendChild(d);
    while (box.children.length > 8) box.removeChild(box.firstChild);

  function renderBattle(v) {

    disp.energy = b.energy; disp.energyMax = b.energyMax;
    disp.eHp = b.enemies.map(function (e) { return e.hp; });

    $("playerChips").innerHTML = b.block > 0
      ? '<span class="blockChip" id="pblock">盾 ' + b.block + "</span>"

    /* 充能球：槽位下标 0 在最左，新球从最右（下标 n-1）开始出现 */

    /* 随从（大脚）：站在人物右边 */

    } else {
      mw.classList.add("hidden");

    $("enemyRow").innerHTML = b.enemies.map(function (e) {
      const pct = Math.max(0, e.hp / e.maxHp * 100);

        '" id="enemy-' + e.index + '" data-eidx="' + e.index + '">' +

        '<div class="bar' + (e.hp / e.maxHp < .35 ? " hurt" : "") + '"><i style="width:' + pct + '%"></i></div>' +
        '<div class="statuses">' + statusChips(e.st, e.dead) + "</div>" +
        '<div class="chips"><span class="blockChip" id="eblock-' + e.index + '"' + (e.block ? "" : ' style="visibility:hidden"') + ">盾 " + e.block + "</span></div>" +
        '<div class="intent">' + (e.dead ? "已被击败" : "意图：" + esc(e.intent)) + "</div>" +

    $("energyOrbs").innerHTML = orbs;
    $("energyText").textContent = b.energy + " / " + b.energyMax;
    $("starChip").innerHTML = b.star > 0 ? '<span class="starChip">★ 星费 ' + b.star + "</span>" : "";
    $("pileInfo").textContent = "抽牌 " + b.drawCount + "　弃牌 " + b.discardCount + "　消耗 " + b.exhaustCount;

      sp.classList.remove("hidden");

      html += '<div class="shopItem' + (st.removalUsed ? " sold" : "") + '"><div><b>移除一张卡牌</b><div class="d dim">删掉牌组里多余的牌（永恒牌不能删）</div></div><div><span class="tag">75 金币</span> <button class="btn small" data-shop="remove:0"' + (st.removalUsed ? " disabled" : "") + ">使用</button></div></div>";
      html += '<div class="shopItem' + (st.healUsed ? " sold" : "") + '"><div><b>回复 15 点生命</b><div class="d dim">店内服务</div></div><div><span class="tag">40 金币</span> <button class="btn small" data-shop="heal:0"' + (st.healUsed ? " disabled" : "") + ">使用</button></div></div>";
      html += "</div>";
    }
    if (pd.options && pd.options.length) {
      html += '<div class="hr"></div><div class="row">' +
        pd.options.map(function (o, i) {
          return '<button class="btn' + (o.act === "leave" || o.act === "cancel" ? " small" : " primary") + '" data-opt="' + i + '"' +
            (o.disabled ? " disabled" : "") + ">" + esc(o.label) + (o.hint ? '　<span class="hint">' + esc(o.hint) + "</span>" : "") + "</button>";
        }).join("") + "</div>";
    }
    html += "</div>";
    $("nodeBody").innerHTML = html;
  }
  function renderOver(v) {
    const win = v.result === "win";
    $("overTitle").textContent = win ? "通 关" : "倒 下 了";
    $("overBody").innerHTML = '<div class="banner">' +
      (win ? "你击败了塔顶的守关者，尖塔的阴影散去。" : "这次爬塔止步于第 " + v.floor + " 层。") +
      "<div class='hr'></div>" + esc(v.player.name) + "　生命 " + v.player.hp + "/" + v.player.maxHp +
      "　金币 " + v.player.gold + "　牌组 " + v.player.deckCount + " 张　遗物 " + v.player.relics.length +
      " 件　种子 " + v.seed + "</div>";
  }
  function render() {
    const v = E.view();
    if (v.screen === "menu" && menuMode === "char") {
      updateTop(v);
      showScreen("char");
      renderChar(v);
      return;
    }
    updateTop(v);
    showScreen(v.screen);
    if (v.screen === "menu") renderMenu(v);
    else if (v.screen === "char") renderChar(v);
    else if (v.screen === "map") renderMap(v);
    else if (v.screen === "battle") renderBattle(v);
    else if (v.screen === "node") renderNode(v);
    else if (v.screen === "over") renderOver(v);
  }

  /* ---------------- 动画播放 ---------------- */
  function floatText(containerId, text, cls) {
    const box = document.getElementById(containerId);
    if (!box) return;
    const d = document.createElement("div");
    d.className = "float " + (cls || "");
    d.textContent = text;
    box.appendChild(d);
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 900);
  }
  function setPlayerHpDom() {
    $("playerHpText").textContent = disp.pHp + " / " + disp.pMax;
    $("playerHpBar").style.width = Math.max(0, disp.pHp / disp.pMax * 100) + "%";
  }
  function setEnemyHpDom(i) {
    const box = document.getElementById("enemy-" + i);
    if (!box) return;
    const bar = box.querySelector(".bar > i");
    const txt = box.querySelector(".hpText");
    if (bar) bar.style.width = Math.max(0, disp.eHp[i] / disp.eMax[i] * 100) + "%";
    if (txt) txt.textContent = disp.eHp[i] + " / " + disp.eMax[i];
  }
  function setBlockDom(who, idx) {
    if (who === "p") {
      const chip = $("pblock");
      if (chip) { chip.textContent = "盾 " + disp.pBlock; chip.style.visibility = disp.pBlock ? "visible" : "hidden"; }
    } else {
      const chip = $("eblock-" + idx);
      if (chip) { chip.textContent = "盾 " + disp.eBlock[idx]; chip.style.visibility = disp.eBlock[idx] ? "visible" : "hidden"; }
    }
  }
  /* 光球从充能球槽飞向目标 */
  function orbFly(fromEl, toEl, color, dur) {
    if (!fromEl || !toEl) return;
    const a = fromEl.getBoundingClientRect(), c = toEl.getBoundingClientRect();
    const d = document.createElement("div");
    d.className = "orbFly";
    d.style.color = color || "#ffd45c";
    d.style.left = (a.left + a.width / 2 - 10) + "px";
    d.style.top = (a.top + a.height / 2 - 10) + "px";
    d.style.transition = "transform " + (dur || 420) + "ms ease-in,opacity " + (dur || 420) + "ms ease-in";
    document.body.appendChild(d);
    requestAnimationFrame(function () {
      d.style.transform = "translate(" + (c.left + c.width / 2 - a.left - a.width / 2) + "px," +
        (c.top + c.height / 2 - a.top - a.height / 2) + "px) scale(.55)";
      d.style.opacity = ".15";
    });
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, (dur || 420) + 160);
  }
  function stompRing(containerId) {
    const box = document.getElementById(containerId);
    if (!box) return;
    const r = box.getBoundingClientRect();
    const d = document.createElement("div");
    d.className = "stompFx";
    d.style.left = (r.left + r.width / 2 - 35) + "px";
    d.style.top = (r.top + r.height - 70) + "px";
    document.body.appendChild(d);
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 620);
  }
  /* 君王之剑的斩击特效 */
  function swordSlash(idx) {
    const box = document.getElementById("enemy-" + idx);
    if (!box) return;
    const sp = box.querySelector(".sprite");
    if (!sp) return;
    sp.style.position = "relative";
    const d = document.createElement("div");
    d.className = "swordFx";
    d.innerHTML = '<svg width="120" height="120" viewBox="0 0 120 120">' +
      '<path d="M8 96 L92 12" stroke="#ffe9a8" stroke-width="7" stroke-linecap="round" opacity=".95"/>' +
      '<path d="M8 96 L92 12" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>' +
      '<path d="M16 104 L100 20" stroke="#e0b25c" stroke-width="3" stroke-linecap="round" opacity=".8"/></svg>';
    sp.appendChild(d);
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 700);
  }
  function pulseOrbSlot(slot, cls) {
    const o = document.querySelector('#orbRow .orbSlot[data-slot="' + slot + '"]');
    if (o) {
      o.classList.add(cls);
      setTimeout(function () { o.classList.remove(cls); }, 620);
    }
  }
  async function playFx(fx) {
    for (let k = 0; k < fx.length; k++) {
      const f = fx[k];
      if (f.t === "log") { appendLog(f.text, f.cls); continue; }
      if (f.t === "cast") {
        const sp = $("playerSprite");
        if (sp) { sp.classList.add("anim-cast"); await sleep(230); sp.classList.remove("anim-cast"); }
        if (f.text) floatText("playerSide", f.text, "buff");
        continue;
      }
      if (f.t === "lunge") {
        const sp = f.who === "p" ? $("playerSprite") : document.querySelector("#enemy-" + f.idx + " .sprite");
        if (sp) {
          const cls = f.who === "p" ? "anim-lunge" : "anim-lunge-left";
          sp.classList.add(cls);
          await sleep(170);
          sp.classList.remove(cls);
        }
        continue;
      }
      if (f.t === "guard") {
        const sp = $("playerSprite");
        if (sp) { sp.classList.add("anim-guard"); await sleep(170); sp.classList.remove("anim-guard"); }
        continue;
      }
      if (f.t === "float") {
        floatText(f.who === "p" ? "playerSide" : "enemy-" + f.idx, f.text, f.cls);
        await sleep(140);
        continue;
      }
      if (f.t === "block") {
        if (f.who === "p") { disp.pBlock = Math.max(0, disp.pBlock + (f.amount || 0)); setBlockDom("p", -1); }
        else { disp.eBlock[f.idx] += (f.amount || 0); setBlockDom("e", f.idx); }
        await sleep(100);
        continue;
      }
      /* ---- 充能球 ---- */
      if (f.t === "orb") {
        if (f.op === "channel") {
          const box = document.querySelector('#orbRow .orbSlot[data-slot="' + f.slot + '"]');
          if (box) {
            box.className = "orbSlot filled pop";
            box.style.background = E.ORB_COLOR[f.orb];
            box.textContent = E.ORB_NAME[f.orb].charAt(0);
            box.title = E.ORB_NAME[f.orb];
          }
          floatText("playerSide", "凝聚 " + E.ORB_NAME[f.orb], "star");
          await sleep(240);
        } else if (f.op === "evoke") {
          const box = document.querySelector('#orbRow .orbSlot[data-slot="' + f.slot + '"]');
          const target = document.querySelector("#enemy-0 .sprite") || $("playerSide");
          if (box) {
            box.classList.add("flash");
            orbFly(box, target, E.ORB_COLOR[f.orb], 400);
          }
          await sleep(290);
          if (box) { box.className = "orbSlot"; box.style.background = ""; box.textContent = "·"; box.title = ""; }
        } else if (f.op === "passive") {
          pulseOrbSlot(f.slot, "passive");
          await sleep(170);
        }
        continue;
      }
      /* ---- 随从（大脚） ---- */
      if (f.t === "minion") {
        const sp = $("minionSprite");
        if (f.op === "summon") {
          $("minionWrap").classList.remove("hidden");
          if (sp) {
            sp.innerHTML = svgMinion();
            sp.classList.remove("summon"); void sp.offsetWidth; sp.classList.add("summon");
          }
          floatText("playerSide", "召唤大脚！", "good");
          await sleep(450);
        } else if (f.op === "attack") {
          if (sp) { sp.classList.remove("attack"); void sp.offsetWidth; sp.classList.add("attack"); }
          const bv = E.view().battle;
          const alive = bv ? bv.enemies.filter(function (e) { return !e.dead; }) : [];
          if (alive.length) stompRing("enemy-" + alive[0].index);
          await sleep(350);
        } else if (f.op === "hurt") {
          if (sp) { sp.classList.remove("hurt"); void sp.offsetWidth; sp.classList.add("hurt"); }
          $("minionHp").textContent = "大脚 " + f.hp + "/" + f.max;
          await sleep(290);
        } else if (f.op === "heal") {
          if (sp) { sp.classList.remove("heal"); void sp.offsetWidth; sp.classList.add("heal"); }
          $("minionHp").textContent = "大脚 " + f.hp + "/" + f.max;
          await sleep(250);
        }
        continue;
      }
      /* ---- 君王之剑 ---- */
      if (f.t === "forge") {
        $("forgeRow").innerHTML = "君王剑：" + f.value;
        $("forgeRow").classList.remove("pop");
        void $("forgeRow").offsetWidth;
        $("forgeRow").classList.add("pop");
        floatText("playerSide", "铸造 +" + f.value, "buff");
        await sleep(300);
        continue;
      }
      if (f.t === "sword") { swordSlash(f.idx); await sleep(290); continue; }
      if (f.t === "star") {
        $("starChip").innerHTML = '<span class="starChip">★ 星费 ' + f.value + "</span>";
        floatText("playerSide", "★ 星费 +", "star");
        await sleep(170);
        continue;
      }
      if (f.t === "doom") {
        const box = document.getElementById("enemy-" + f.idx);
        if (f.kill) floatText("enemy-" + f.idx, "恶兆降临！", "buff");
        else if (box) floatText("enemy-" + f.idx, "恶兆 " + f.value, "buff");
        await sleep(230);
        continue;
      }
      if (f.t === "impact") {
        if (f.who === "e") {
          const box = document.getElementById("enemy-" + f.idx);
          const sp = box && box.querySelector(".sprite");
          if (sp) sp.classList.add("anim-shake", "anim-hit");
          if (box) box.classList.add("anim-shake");
          disp.eHp[f.idx] = Math.max(0, disp.eHp[f.idx] - f.dmg);
          setEnemyHpDom(f.idx);
          if (f.dmg > 0) floatText("enemy-" + f.idx, "-" + f.dmg, "dmg");
          await sleep(200);
          if (sp) sp.classList.remove("anim-shake", "anim-hit");
          if (box) box.classList.remove("anim-shake");
        } else {
          const sp = $("playerSprite");
          if (sp) sp.classList.add("anim-shake", "anim-hit");
          $("flash").classList.add("on");
          disp.pHp = Math.max(0, disp.pHp - f.dmg);
          setPlayerHpDom();
          floatText("playerSide", f.dmg > 0 ? "-" + f.dmg : "格挡", f.dmg > 0 ? "dmg" : "blk");
          await sleep(220);
          $("flash").classList.remove("on");
          if (sp) sp.classList.remove("anim-shake", "anim-hit");
        }
        continue;
      }
      if (f.t === "die") {
        const box = document.getElementById("enemy-" + f.idx);
        if (box) {
          box.classList.add("dead");
          const it = box.querySelector(".intent");
          if (it) it.textContent = "已被击败";
          const stx = box.querySelector(".statuses");
          if (stx) stx.innerHTML = "";
        }
        await sleep(230);
        continue;
      }
      if (f.t === "refresh") { await sleep(110); continue; }
      if (f.t === "sel") { await sleep(120); continue; }
      if (f.t === "victory" || f.t === "defeat") { await sleep(420); continue; }
    }
  }

  function flashHint(text) {
    $("battleHint").textContent = text;
    $("battleHint").style.color = "#e05c5c";
    setTimeout(function () { $("battleHint").style.color = ""; }, 1400);
  }

  /* ---------------- 动作 ---------------- */
  async function act(fn) {
    if (busy) return;
    busy = true;
    let res = null;
    try { res = fn(); } catch (err) { console.error(err); }
    if (res && res.ok) await playFx(res.fx || []);
    else if (res && res.msg) flashHint(res.msg);
    busy = false;
    render();
  }
  function doPlay(handIndex, targetIndex) {
    targetMode = null;
    return act(function () { return E.playCard(handIndex, targetIndex); });
  }
  function doEndTurn() {
    targetMode = null;
    return act(function () { return E.endTurn(); });
  }
  function doPotion(slot, targetIndex) {
    closeModal();
    targetMode = null;
    return act(function () { return E.usePotion(slot, targetIndex); });
  }
  function doChoose(i) { return act(function () { return E.choose(i); }); }
  function doPick(i) { return act(function () { return E.pick(i); }); }
  function doSelPick(i) { return act(function () { return E.selPick(i); }); }
  function doSelCancel() { return act(function () { return E.selCancel(); }); }
  function onCardClick(i) {
    const v = E.view();
    const card = v.battle && v.battle.hand[i];
    if (!card) return;
    if (v.battle.sel) { flashHint("先完成上面的选牌"); return; }
    if (!card.playable) {
      const s = E.cardStats({ id: card.id, up: card.up });
      if ((s.starCost | 0) > v.battle.star) flashHint("星费不足（需要 " + s.starCost + "）");
      else flashHint("能量不足，先用其它牌或结束回合");
      return;
    }
    const alive = v.battle.enemies.filter(function (e) { return !e.dead; });
    if (E.needsTarget({ id: card.id, up: card.up }) && alive.length > 1) {
      targetMode = i;
      render();
      return;
    }
    doPlay(i, alive.length ? alive[0].index : -1);
  }

  /* ---------------- 事件绑定 ---------------- */
  document.addEventListener("click", function (ev) {
    const t = ev.target;
    if (!t.closest) return;
    const selEl = t.closest("[data-sel]");
    if (selEl && !busy) { doSelPick(+selEl.dataset.sel); return; }
    const selCancel = t.closest("[data-selcancel]");
    if (selCancel && !busy) { doSelCancel(); return; }
    const cardEl = t.closest("[data-hand]");
    if (cardEl && !busy && !$("screen-battle").classList.contains("hidden")) { onCardClick(+cardEl.dataset.hand); return; }
    const enemyEl = t.closest(".enemy");
    if (enemyEl && !busy && targetMode != null) {
      const idx = +enemyEl.dataset.eidx;
      if (typeof targetMode === "number") doPlay(targetMode, idx);
      else doPotion(targetMode.potion, idx);
      return;
    }
    const optEl = t.closest("[data-opt]");
    if (optEl && !busy) { doChoose(+optEl.dataset.opt); return; }
    const pickEl = t.closest("[data-pick]");
    if (pickEl && !busy) { doPick(+pickEl.dataset.pick); return; }
    const shopEl = t.closest("[data-shop]");
    if (shopEl && !busy) {
      const parts = shopEl.dataset.shop.split(":");
      E.shopBuy(parts[0], +parts[1]);
      render();
      return;
    }
    const potEl = t.closest("[data-potion]");
    if (potEl && !busy) {
      const slot = +potEl.dataset.potion;
      const id = E.view().player.potions[slot];
      const needsT = id && (id.id === 3 || id.id === 4 || id.id === 5);
      const bv = E.view().battle;
      const alive = bv ? bv.enemies.filter(function (e) { return !e.dead; }) : [];
      if (needsT && alive.length > 1) { closeModal(); targetMode = { potion: slot }; render(); }
      else doPotion(slot, alive.length ? alive[0].index : -1);
      return;
    }
    const dropEl = t.closest("[data-drop]");
    if (dropEl && !busy) { E.dropPotion(+dropEl.dataset.drop); closeModal(); render(); return; }
    const actEl = t.closest("[data-act]");
    if (actEl && !busy) {
      const a = actEl.dataset.act;
      if (a === "new") { menuMode = "char"; render(); }
      else if (a === "continue") { if (E.load()) render(); }
      else if (a === "help") helpModal();
      else if (a === "cards") cardsModal();
      return;
    }
    const charEl = t.closest("[data-char]");
    if (charEl && !busy) {
      const seedTxt = (($("seedInput") && $("seedInput").value) || "").trim();
      const seed = seedTxt ? (parseInt(seedTxt, 10) >>> 0) : 0;
      E.newRun(+charEl.dataset.char, seed);
      menuMode = "root";
      render();
      return;
    }
  });
  document.addEventListener("keydown", function (ev) {
    if (busy) return;
    const v = E.view();
    if (!v || v.screen !== "battle") return;
    const k = ev.key;
    if (k >= "1" && k <= "9") { onCardClick(+k - 1); return; }
    if (k === "e" || k === "E" || k === " ") { ev.preventDefault(); doEndTurn(); return; }
    if (k === "d" || k === "D") { deckModal(); return; }
    if (k === "Escape") { targetMode = null; closeModal(); render(); return; }
  });
  $("btnEndTurn").addEventListener("click", function () { if (!busy) doEndTurn(); });
  $("btnSpeed").addEventListener("click", function () {
    speed = speed === 1 ? 0.5 : (speed === 0.5 ? 0 : 1);
    $("btnSpeed").textContent = "动画：" + (speed === 1 ? "正常" : (speed === 0.5 ? "快" : "关闭"));
  });
  $("btnPiles").addEventListener("click", deckModal);
  $("btnPotion").addEventListener("click", potionModal);
  $("btnHelp").addEventListener("click", helpModal);
  $("btnMenu").addEventListener("click", function () { E.toMenu(); render(); });
  $("modalClose").addEventListener("click", closeModal);
  $("btnOverBack").addEventListener("click", function () { E.toMenu(); render(); });
  $("btnMapDeck").addEventListener("click", deckModal);
  $("btnCharBack").addEventListener("click", function () { menuMode = "root"; render(); });
  $("modal").addEventListener("click", function (ev) { if (ev.target === $("modal")) closeModal(); });
  $("stage").addEventListener("click", function (ev) {
    if (targetMode != null && !ev.target.closest(".enemy")) { targetMode = null; render(); }
  });

  window.__spire = { engine: E, render: render, view: E.view, playFx: playFx };
  render();
})();
</script>
