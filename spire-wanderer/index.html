<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>尖塔行者 · Spire Wanderer</title>
<style>
  :root{
    --bg:#0e1117;
    --bg2:#151a24;
    --panel:#1a2130;
    --line:#2c3446;
    --txt:#e9e7e3;
    --dim:#9aa4b8;
    --gold:#e0b25c;
    --red:#e05c5c;
    --green:#5fbf7a;
    --blue:#5b9ae0;
    --purple:#b07de0;
    --star:#9fe0ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:radial-gradient(1200px 700px at 50% -10%,#1b2333 0%,var(--bg) 60%);
    color:var(--txt);
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:15px;line-height:1.5;
    display:flex;justify-content:center;
  }
  #app{width:100%;max-width:980px;min-height:100%;display:flex;flex-direction:column;padding:10px 12px 16px}
  h1,h2,h3{margin:0;font-weight:600}
  .hidden{display:none !important}
  .dim{color:var(--dim)}
  .gold{color:var(--gold)}
  .red{color:var(--red)}
  .green{color:var(--green)}
  .blue{color:var(--blue)}
  .purple{color:var(--purple)}
  .cyan{color:#6fd3d3}

  /* ---------- 通用组件 ---------- */
  .btn{
    background:linear-gradient(#2a3346,#1d2534);border:1px solid var(--line);color:var(--txt);
    padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px;font-family:inherit;
    transition:transform .08s,border-color .15s,background .15s;
  }
  .btn:hover{border-color:var(--gold);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.primary{background:linear-gradient(#4a3a1c,#2f2513);border-color:#7a5f2a;color:#f2dfae}
  .btn.primary:hover{border-color:var(--gold)}
  .btn.small{padding:5px 10px;font-size:13px}
  .btn:disabled{opacity:.4;cursor:default;transform:none;border-color:var(--line)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
  .hr{height:1px;background:var(--line);margin:10px 0}

  /* ---------- 顶栏 ---------- */
  #topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  #progressTrack{width:150px;height:8px;background:#232a38;border-radius:4px;overflow:hidden}
  #progressFill{height:100%;width:0;background:linear-gradient(90deg,#7a5f2a,var(--gold));transition:width .3s}

  /* ---------- 舞台 ---------- */
  #stage{
    position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;
    background:linear-gradient(180deg,rgba(30,38,54,.55),rgba(14,17,23,.2));
    border:1px solid var(--line);border-radius:12px;padding:14px 12px 10px;min-height:270px;
  }
  .combatant{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
  .spriteRow{display:flex;align-items:flex-end;gap:4px}
  .sprite{position:relative;transition:transform .13s ease}
  .sprite svg{display:block;overflow:visible}
  .name{font-size:13px;color:var(--dim)}
  .bar{width:108px;height:10px;background:#242b39;border:1px solid #333c50;border-radius:5px;overflow:hidden;position:relative}
  .bar > i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#3f7d52,#5fbf7a);transition:width .3s}
  .bar.hurt > i{background:linear-gradient(90deg,#7d3f3f,var(--red))}
  .hpText{font-size:12px;color:var(--dim)}
  .blockChip{
    display:inline-flex;align-items:center;gap:4px;background:#16263c;border:1px solid #2f5a8c;
    color:#9ecbff;border-radius:12px;padding:1px 8px;font-size:12px
  }
  .statuses{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:18px}
  .st{border-radius:10px;padding:1px 6px;font-size:11px;border:1px solid}
  .st.str{color:#ffcf7a;border-color:#6a5020;background:#2a2213}
  .st.vuln{color:#ff9a9a;border-color:#7a3030;background:#2b1717}
  .st.weak{color:#c8b3ff;border-color:#4b3a7a;background:#201a33}
  .st.poison{color:#a5e88f;border-color:#3a6a35;background:#172a16}
  .st.doom{color:#d8a6ff;border-color:#5a3a7a;background:#221631}
  .st.plating{color:#9fe8d8;border-color:#2f6a5c;background:#152a26}
  .st.other{color:#9ecbff;border-color:#2f5a8c;background:#16263c}
  .intent{font-size:13px;color:var(--gold);min-height:20px;text-align:center}
  .enemies{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;justify-content:flex-end}
  .enemy{cursor:pointer;border-radius:10px;padding:4px 6px;border:1px solid transparent;transition:border-color .12s,background .12s}
  .enemy.targetable:hover{border-color:var(--gold);background:rgba(224,178,92,.08)}
  .enemy.dead{opacity:.35;filter:grayscale(1)}
  .enemy.dead .intent{color:var(--dim)}
  .deadTag{font-size:12px;color:var(--dim)}

  /* ---------- 充能球 ---------- */
  .orbRow{display:flex;gap:5px;align-items:center;justify-content:center;min-height:24px}
  .orbSlot{
    width:22px;height:22px;border-radius:50%;background:#141a26;border:1px dashed #38435a;
    display:flex;align-items:center;justify-content:center;font-size:11px;color:#5c6a86;
    transition:transform .18s,border-color .2s;
  }
  .orbSlot.filled{
    border-style:solid;font-weight:700;color:#0e1117;
    box-shadow:0 0 10px rgba(255,255,255,.28), inset 0 -4px 8px rgba(0,0,0,.28);
  }
  .orbSlot.pop{animation:orbPop .42s ease-out}
  .orbSlot.flash{animation:orbFlash .5s ease-out}
  .orbSlot.passive{animation:orbPulse .55s ease-in-out}
  @keyframes orbPop{0%{transform:scale(.2);opacity:0}55%{transform:scale(1.35);opacity:1}100%{transform:scale(1)}}
  @keyframes orbFlash{0%{transform:scale(1)}30%{transform:scale(1.5);filter:brightness(2)}100%{transform:scale(1)}}
  @keyframes orbPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.28)}}
  .orbLabel{font-size:11px;color:var(--dim)}

  /* 激发时飞出去的光球 */
  .orbFly{position:fixed;width:20px;height:20px;border-radius:50%;pointer-events:none;z-index:60;
          box-shadow:0 0 14px currentColor;background:currentColor}

  /* ---------- 君王剑 ---------- */
  .forgeRow{font-size:12px;color:var(--gold);min-height:18px;letter-spacing:1px}
  .forgeRow.pop{animation:forgePop .55s ease-out}
  @keyframes forgePop{0%{transform:scale(.6);text-shadow:0 0 0}45%{transform:scale(1.35);text-shadow:0 0 16px #ffd98a}100%{transform:scale(1)}}
  .swordFx{position:absolute;left:0;right:0;top:-4px;height:110px;pointer-events:none;overflow:visible}
  .swordFx svg{position:absolute;right:-10px;top:0;animation:slashSweep .42s ease-out}
  @keyframes slashSweep{0%{transform:translate(-46px,-26px) rotate(-28deg);opacity:0}
                       35%{opacity:1}100%{transform:translate(18px,16px) rotate(6deg);opacity:0}}

  /* ---------- 随从（大脚） ---------- */
  .minionWrap{display:flex;flex-direction:column;align-items:center;gap:2px}
  .minion{position:relative;transform-origin:50% 90%}
  .minion.summon{animation:minionPop .6s cubic-bezier(.2,1.6,.4,1)}
  .minion.attack{animation:minionStomp .5s ease-in-out}
  .minion.hurt{animation:minionHurt .42s linear}
  .minion.heal{animation:minionHeal .5s ease-out}
  @keyframes minionPop{0%{transform:scale(.1) translateY(26px);opacity:0}
                      60%{transform:scale(1.2) translateY(-8px);opacity:1}100%{transform:scale(1) translateY(0)}}
  @keyframes minionStomp{0%{transform:translate(0,0) rotate(0)}
                         30%{transform:translate(14px,-16px) rotate(-12deg)}
                         60%{transform:translate(30px,4px) rotate(10deg)}
                         100%{transform:translate(0,0) rotate(0)}}
  @keyframes minionHurt{0%,100%{transform:translateX(0);filter:none}
                        25%{transform:translateX(-4px);filter:brightness(2.2) saturate(1.5)}
                        75%{transform:translateX(4px);filter:brightness(2.2) saturate(1.5)}}
  @keyframes minionHeal{0%{transform:scale(1)}50%{transform:scale(1.16);filter:brightness(1.5) hue-rotate(60deg)}100%{transform:scale(1)}}
  .minionName{font-size:11px;color:#8fe0a2}
  .stompFx{position:fixed;width:70px;height:70px;pointer-events:none;z-index:55;
           border-radius:50%;border:3px solid rgba(255,224,140,.85);animation:stompRing .5s ease-out}
  @keyframes stompRing{0%{transform:scale(.25);opacity:.95}100%{transform:scale(1.5);opacity:0}}

  /* ---------- 动作动画 ---------- */
  @keyframes lungeRight{0%{transform:translateX(0)}45%{transform:translateX(26px)}100%{transform:translateX(0)}}
  @keyframes lungeLeft{0%{transform:translateX(0)}45%{transform:translateX(-26px)}100%{transform:translateX(0)}}
  @keyframes shakeIt{0%,100%{transform:translate(0,0)}25%{transform:translate(-4px,1px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-3px,2px)}}
  @keyframes floatUp{0%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-46px);opacity:0}}
  @keyframes popIn{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes castGlow{0%{filter:none}50%{filter:brightness(1.5) drop-shadow(0 0 10px #e0b25c)}100%{filter:none}}
  .anim-lunge{animation:lungeRight .26s ease forwards}
  .anim-lunge-left{animation:lungeLeft .26s ease forwards}
  .anim-shake{animation:shakeIt .3s linear}
  .anim-hit{filter:brightness(2.4) saturate(1.6) drop-shadow(0 0 8px #ff6b6b)}
  .anim-guard{filter:brightness(1.5) drop-shadow(0 0 9px #5b9ae0)}
  .anim-cast{animation:castGlow .5s ease}
  .float{
    position:absolute;left:50%;top:-6px;transform:translateX(-50%);
    font-weight:700;font-size:20px;pointer-events:none;animation:floatUp .85s ease-out forwards;white-space:nowrap;
  }
  .float.dmg{color:#ff8a8a;text-shadow:0 2px 6px rgba(0,0,0,.6)}
  .float.blk{color:#8fc4ff}
  .float.good{color:#8fe0a2}
  .float.buff{color:#ffd98a}
  .float.star{color:var(--star)}

  /* ---------- 手牌 ---------- */
  #handRow{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 6px}
  .card{
    flex:0 0 138px;position:relative;background:linear-gradient(#1d2534,#161c28);border:1px solid var(--line);
    border-radius:10px;padding:8px;cursor:pointer;transition:transform .1s,border-color .15s;text-align:left;
  }
  .card:hover{transform:translateY(-5px);border-color:var(--gold)}
  .card.attack{border-left:3px solid #d06060}
  .card.skill{border-left:3px solid #5b9ae0}
  .card.power{border-left:3px solid #b07de0}
  .card.no{opacity:.42}
  .card .cname{font-weight:600;font-size:14px;padding-right:44px}
  .card .cost{
    position:absolute;right:6px;top:6px;min-width:22px;height:22px;border-radius:50%;
    background:#2b3b56;border:1px solid #4b6b96;color:#cfe4ff;font-size:12px;
    display:flex;align-items:center;justify-content:center;padding:0 3px;
  }
  .card .scost{
    position:absolute;right:32px;top:6px;min-width:22px;height:22px;border-radius:50%;
    background:#1d3340;border:1px solid #3f7f96;color:var(--star);font-size:12px;
    display:flex;align-items:center;justify-content:center;padding:0 3px;
  }
  .card .ctype{font-size:11px;color:var(--dim);margin-bottom:4px}
  .card .cdesc{font-size:12px;color:#cfd6e4;min-height:34px}
  .card .ckw{font-size:11px;color:#e0b25c;margin-top:3px}
  .card.up .cname{color:#8fe0a2}
  .card .ctag{position:absolute;left:6px;bottom:5px;font-size:10px;color:var(--dim)}

  /* ---------- 日志 / 底栏 ---------- */
  #bottombar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .energy{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .orb{width:20px;height:20px;border-radius:50%;background:#3a3320;border:1px solid #6a5a2a}
  .orb.on{background:radial-gradient(circle at 35% 35%,#ffe6a8,#c99a2e);border-color:#ffd88a;box-shadow:0 0 8px rgba(255,214,120,.5)}
  .starChip{color:var(--star);border:1px solid #3f7f96;background:#12242c;border-radius:12px;padding:1px 8px;font-size:12px}
  #log{height:76px;overflow:hidden;font-size:13px;color:#b9c2d4;display:flex;flex-direction:column;justify-content:flex-end;gap:1px}
  #log div{opacity:.9}

  /* ---------- 各种界面 ---------- */
  .screenTitle{font-size:20px;margin-bottom:6px}
  .choices{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .choice{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;
    transition:border-color .15s,transform .08s;text-align:left;color:var(--txt);font-family:inherit;font-size:15px;
  }
  .choice:hover{border-color:var(--gold);transform:translateY(-2px)}
  .choice .t{font-weight:600;margin-bottom:3px}
  .choice .d{font-size:13px;color:var(--dim)}
  .charGrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));width:100%}
  .charCard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;text-align:center;color:var(--txt);font-family:inherit}
  .charCard:hover{border-color:var(--gold);transform:translateY(-2px)}
  .charCard .cn{font-size:16px;font-weight:600}
  .charCard .cd{font-size:12px;color:var(--dim);min-height:34px}
  .charCard .chp{font-size:12px;color:#8fe0a2}
  .rewardList{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .shopItem{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#161c28;
    border:1px solid var(--line);border-radius:10px;padding:10px}
  .shopItem.sold{opacity:.4}
  .tag{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:1px 6px}
  .relicList{display:flex;flex-wrap:wrap;gap:6px}
  .relic{background:#1d2331;border:1px solid #4a3f22;color:#e6cd93;border-radius:8px;padding:1px 8px;font-size:12px}
  .potionBtn{background:#17242a;border:1px solid #2e5a5a;border-radius:8px;padding:3px 8px;color:#cfe9e9;cursor:pointer;font-size:13px;font-family:inherit}
  .potionBtn:hover{border-color:#4fa3a3}
  .potions{display:flex;gap:6px;flex-wrap:wrap}
  .bag{display:flex;gap:8px;flex-wrap:wrap;font-size:13px}
  .center{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;width:100%}
  .titleArt{font-size:34px;letter-spacing:6px;color:var(--gold);text-shadow:0 4px 16px rgba(224,178,92,.35)}
  .sub{color:var(--dim);font-size:13px}
  .banner{padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);width:100%}
  .flashRed{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 45%,rgba(200,40,40,.5));opacity:0;transition:opacity .12s}
  .flashRed.on{opacity:1}
  .hint{font-size:12px;color:var(--dim)}
  /* 选牌面板 */
  #selPanel{border:1px solid #7a5f2a;background:linear-gradient(#241d10,#1a1a24);border-radius:10px;padding:10px;margin-top:8px}
  #selPanel .selTitle{color:var(--gold);font-weight:600;margin-bottom:6px;font-size:14px}
  @media (max-width:640px){
    body{font-size:14px}
    #stage{padding:10px 8px}
    .bar{width:84px}
    .card{flex:0 0 124px}
    .titleArt{font-size:26px;letter-spacing:4px}
    .orbSlot{width:19px;height:19px}
  }
</style>

    x ^= x << 13; x >>>= 0;
    x ^= x >>> 17;
    x ^= x << 5;  x >>>= 0;
    rngState = x;
    return x >>> 0;

    rngState = (n >>> 0) || 0x9e3779b9;
    for (let i = 0; i < 8; i++) rnd();

  function pickOne(arr) { return arr.length ? arr[rand(arr.length)] : null; }
  function shuffle(arr) {

      d.push({ id: sg, up: 0 });
      /* 储君：牌组里带一把「君王之剑」（保留在手上，靠铸造变强） */
      if (ch.pool === "储君" && swordId() >= 0) d.push({ id: swordId(), up: 0 });
      return d;
    }
    for (let i = 0; i < 5; i++) d.push({ id: C_STRIKE, up: 0 });
    for (let i = 0; i < 4; i++) d.push({ id: C_DEFEND, up: 0 });
    d.push(charId === 1 ? { id: 3, up: 0 } : { id: 2, up: 0 });
    return d;
  }

  /* ---------------- 遗物 / 药水 ---------------- */
  function hasRelic(id) { return state && state.player.relics.indexOf(id) >= 0; }
  function addRelic(id) {
    if (id < 0 || hasRelic(id)) return false;
    state.player.relics.push(id);
    if (id === R.VIAL) {
      state.player.maxHp += 2;
      state.player.hp = Math.min(state.player.maxHp, state.player.hp + 2);
    }
    return true;
  }
  function randomRelic() {
    const pool = [];
    for (let i = 0; i < RELICS.length; i++) if (!hasRelic(i)) pool.push(i);
    return pool.length ? pickOne(pool) : -1;
  }
  function addPotion(id) {
    for (let i = 0; i < 3; i++) if (state.player.potions[i] < 0) { state.player.potions[i] = id; return true; }
    return false;
  }
  function randomPotionId() { return rand(POTIONS.length); }
  function healPlayer(n) {
    state.player.hp = Math.min(state.player.maxHp, state.player.hp + n);
  }

  /* ---------------- 地图 ---------------- */
  const NODE = { BATTLE: 0, ELITE: 1, REST: 2, SHOP: 3, TREASURE: 4, EVENT: 5, BOSS: 6 };
  const NODE_INFO = {
    0: { n: "普通战斗", d: "胜利后三选一获得一张卡牌" },
    1: { n: "精英战斗", d: "更强，但胜利必定获得一件遗物" },
    2: { n: "休息处", d: "回复生命 / 升级卡牌 / 移除卡牌" },
    3: { n: "商店", d: "用金币买卡牌、药水与遗物" },
    4: { n: "宝箱", d: "免费获得遗物与药水，或换一笔金币" },
    5: { n: "事件", d: "未知的遭遇" },
    6: { n: "首领", d: "塔顶的守关者，击败它即通关" }
  };
  function generateChoices() {
    const floor = state.floor;
    const c = [];
    if (floor >= state.maxFloor) { c.push(NODE.BOSS); state.choices = c; return; }
    if (floor <= 1) { c.push(NODE.BATTLE); state.choices = c; return; }
    let want = chance(35) ? 3 : 2;
    let usedRest = 0, usedShop = 0, usedElite = 0;
    for (let i = 0; i < want; i++) {
      if (floor === 8 && i === 0) { c.push(NODE.TREASURE); continue; }
      let guard = 0, t = NODE.BATTLE;
      while (guard++ < 64) {
        const roll = rand(100);
        if (roll < 45) t = NODE.BATTLE;
        else if (roll < 63) t = NODE.EVENT;
        else if (roll < 73) t = NODE.REST;
        else if (roll < 83) t = NODE.SHOP;
        else if (roll < 90) t = floor >= 4 ? NODE.TREASURE : NODE.BATTLE;
        else t = floor >= 5 ? NODE.ELITE : NODE.BATTLE;
        if (t === NODE.REST && usedRest) continue;
        if (t === NODE.SHOP && usedShop) continue;
        if (t === NODE.ELITE && usedElite) continue;
        if (t === NODE.REST) usedRest = 1;
        if (t === NODE.SHOP) usedShop = 1;
        if (t === NODE.ELITE) usedElite = 1;
        break;
      }
      c.push(t);
    }
    state.choices = c;
  }

  /* ==================================================================
   *  战斗
   * ================================================================== */
  function aliveEnemies() { return state.battle.enemies.filter(function (e) { return e.alive; }); }
  function aliveCount() { return state.battle.enemies.filter(function (e) { return e.alive; }).length; }
  function firstAlive() {
    const b = state.battle;
    for (let i = 0; i < b.enemies.length; i++) if (b.enemies[i].alive) return i;
    return -1;
  }
  function aliveIdxList() {
    const b = state.battle, out = [];
    for (let i = 0; i < b.enemies.length; i++) if (b.enemies[i].alive) out.push(i);
    return out;
  }

  /* 玩家「有效」力量 / 敏捷 / 集中（含本回合、下回合的临时加成） */
  function effStr() { return state.battle.pst.str + state.battle.tempStr; }
  function effDex() { return state.battle.pst.dex + state.battle.tempDex; }
  function effFocus() { return state.battle.focus + state.battle.tempFocus; }
  function enemyEffStr(i) { return state.battle.enemies[i].st.str - (state.battle.enemies[i].st.tempStr | 0); }

  function rollEncounter(kind) {
    if (kind === 2) return [chance(50) ? EN.GUARDIAN : EN.BROOD];
    const table = kind === 1 ? ENC_ELITE : ENC_NORMAL;
    let total = 0;
    const weights = table.map(function (t) { const w = state.floor >= t.min ? t.w : 0; total += w; return w; });
    if (total <= 0) return [EN.SLIME];
    let roll = rand(total), pickIdx = 0;
    for (let i = 0; i < table.length; i++) {
      if (roll < weights[i]) { pickIdx = i; break; }
      roll -= weights[i];
    }
    return table[pickIdx].ids.slice(0, 3);
  }

  function spawnEnemy(defId) {
    const def = ENEMIES[defId];
    const bonus = Math.floor((state.floor - 1) / 3);
    const maxHp = randInt(def.hp[0], def.hp[1]) + bonus;
    const e = {
      defId: defId, hp: maxHp, maxHp: maxHp, block: 0, st: newStatus(),
      moveIndex: rand(def.mv.length), nextMove: 0, alive: true,
      gold: randInt(def.gold[0], def.gold[1]) + state.floor, stolen: 0
    };
    e.st.str = def.str + Math.floor((state.floor - 1) / 6);
    pickEnemyMove(e);
    return e;
  }
  function pickEnemyMove(e) {
    const def = ENEMIES[e.defId];
    if (def.ai === "random") e.nextMove = rand(def.mv.length);
    else { e.nextMove = e.moveIndex % def.mv.length; e.moveIndex = (e.moveIndex + 1) % def.mv.length; }
  }

  function startBattle(kind) {
    const ids = rollEncounter(kind);
    const b = {
      kind: kind, elite: kind === 1, boss: kind === 2,
      enemies: [], draw: [], hand: [], discard: [], exhaust: [],
      pst: newStatus(), pblock: 0, energy: 3, energyMax: 3, turn: 0,
      attacksPlayed: 0, cardsPlayed: 0, over: null,
      orbs: [], orbDark: [], orbSlots: 3, focus: 0,
      minion: 0, minionMax: 0, forge: 0, star: 0,
      tempStr: 0, tempDex: 0, tempFocus: 0, tempBlock: 0, tempExpire: 0,
      enemyTempStr: [], retainHand: 0, freePlay: 0, skillsFree: 0, exhaustSkills: 0,
      nextDraw: 0, bonusEnergy: 0, sel: null
    };
    for (let i = 0; i < MAX_ORBS; i++) { b.orbs.push(ORB.NONE); b.orbDark.push(0); }
    for (let i = 0; i < ids.length; i++) b.enemies.push(spawnEnemy(ids[i]));
    b.enemyTempStr = b.enemies.map(function () { return 0; });
    state.battle = b;
    state.screen = "battle";
    /* 闪电核心：战斗开始时生成一个闪电充能球（充能球从右往左填充） */
    if (hasRelic(R.LIGHTNING)) b.orbs[b.orbSlots - 1] = ORB.LIGHTNING;
    if (hasRelic(R.VAJRA)) b.pst.str += 1;
    if (hasRelic(R.STONE)) b.pst.dex += 1;
    if (hasRelic(R.TOME)) b.pst.extraDraw += 1;
    for (let i = 0; i < state.player.deck.length; i++) {
      b.draw.push({ id: state.player.deck[i].id, up: state.player.deck[i].up });
    }
    shuffle(b.draw);
    pushLog("遭遇：" + b.enemies.map(function (e) { return ENEMIES[e.defId].n; }).join("、"), "red");
    const fx = beginTurn();
    return fx;
  }

  /* ---------------- 牌堆 ---------------- */
  function reshuffle(fx) {
    const b = state.battle;
    if (b.draw.length || !b.discard.length) return;
    b.draw = b.discard;
    b.discard = [];
    shuffle(b.draw);
    pushLog("（弃牌堆已洗回抽牌堆）", "dim");
    if (fx) fx.push({ t: "refresh" });
  }
  function drawCards(n, fx) {
    const b = state.battle;
    let got = 0;
    for (let i = 0; i < n; i++) {
      if (b.hand.length >= MAX_HAND) break;
      reshuffle(fx);
      if (!b.draw.length) break;
      b.hand.push(b.draw.pop());
      got++;
    }
    return got;
  }
  function gainBlock(base, fx) {
    const b = state.battle;
    let v = base + effDex();
    if (b.pst.frail > 0) v = Math.floor(v * 3 / 4);
    v = Math.max(0, v);
    b.pblock += v;
    if (fx) fx.push({ t: "block", who: "p", idx: -1, amount: v });
    return v;
  }
  function playerLoseHp(n, fx) {
    state.player.hp -= n;
    if (state.player.hp < 0) state.player.hp = 0;
    if (fx) fx.push({ t: "impact", who: "p", idx: -1, dmg: n, blocked: 0, self: 1 });
  }
  function endTurnDiscard() {
    const b = state.battle;
    let i = 0;
    while (i < b.hand.length) {
      const c = b.hand[i];
      const kw = cardKeywords(c);
      if (kw & KW.ETHEREAL) { b.exhaust.push(c); b.hand.splice(i, 1); continue; }
      if (kw & KW.RETAIN) { i++; continue; }
      b.discard.push(c);
      b.hand.splice(i, 1);
    }
  }
  function pullInnate() {
    const b = state.battle;
    let i = 0;
    while (i < b.draw.length && b.hand.length < MAX_HAND) {
      const c = b.draw[i];
      if (cardKeywords(c) & KW.INNATE) {
        b.hand.push(c);
        b.draw.splice(i, 1);
        continue;
      }
      i++;
    }
  }
  function pullReturning(fx) {
    const b = state.battle;
    let i = 0;
    while (i < b.discard.length) {
      const c = b.discard[i];
      if (!c.rth) { i++; continue; }
      if (b.hand.length >= MAX_HAND) return;
      c.rth = 0;
      b.discard.splice(i, 1);
      b.hand.push(c);
      pushLog(cardName(c) + " 回到了你的手牌。", "blue");
      if (fx) fx.push({ t: "float", who: "p", idx: -1, text: cardName(c) + " 回手", cls: "buff" });
    }
  }
  function discardCardAt(index, fx) {
    const b = state.battle;
    const c = b.hand[index];
    b.hand.splice(index, 1);
    b.discard.push(c);
    maybeSly(c, fx);
    return c;
  }
  function discardHand(fx) {
    const b = state.battle;
    while (b.hand.length) {
      const c = b.hand.shift();
      b.discard.push(c);
      maybeSly(c, fx);
    }
  }
  function discardRandom(n, fx) {
    const b = state.battle;
    for (let i = 0; i < n && b.hand.length > 0; i++) discardCardAt(rand(b.hand.length), fx);
  }
  /* 奇巧：被弃置时免费打出 */
  function maybeSly(card, fx) {
    if (!(cardKeywords(card) & KW.SLY)) return;
    const b = state.battle;
    const at = b.discard.lastIndexOf(card);
    if (at >= 0) b.discard.splice(at, 1);
    pushLog("奇巧：" + cardName(card) + " 被弃置后免费打出。", "purple");
    playCardFree(card, firstAlive(), fx);
  }

  /* ---------------- 伤害 ---------------- */
  function damageEnemy(idx, raw, fromAttack, fx) {
    const e = state.battle.enemies[idx];
    if (!e || !e.alive) return 0;
    let dmg = Math.max(0, raw);
    if (fromAttack && e.st.vuln > 0) dmg = Math.floor(dmg * 3 / 2);
    const absorbed = Math.min(e.block, dmg);
    e.block -= absorbed;
    dmg -= absorbed;
    e.hp -= dmg;
    if (e.hp <= 0) { e.hp = 0; e.alive = false; }
    return absorbed + dmg;
  }
  function playerAttackValue(base) {
    const b = state.battle;
    let d = base + effStr();
    if (b.pst.weak > 0) d = Math.floor(d * 3 / 4);
    return Math.max(0, d);
  }
  /* 敌人打玩家：随从（大脚）优先吃伤害 */
  function playerTakeAttack(raw, fromIdx, fx) {
    const b = state.battle;
    let dmg = Math.max(0, raw);
    if (b.minion > 0) {
      const soak = Math.min(b.minion, dmg);
      b.minion -= soak;
      dmg -= soak;
      pushLog("大脚替你承受了 " + soak + " 点伤害（剩余 " + b.minion + "/" + b.minionMax + "）。", "green");
      fx.push({ t: "minion", op: "hurt", hp: b.minion, max: b.minionMax, soak: soak });
      if (dmg <= 0) return 0;
    }
    const absorbed = Math.min(b.pblock, dmg);
    b.pblock -= absorbed;
    dmg -= absorbed;
    state.player.hp -= dmg;
    if (state.player.hp < 0) state.player.hp = 0;
    fx.push({ t: "impact", who: "p", idx: -1, dmg: dmg, blocked: absorbed });
    if (dmg > 0) pushLog("你受到 " + dmg + " 点伤害（格挡挡下 " + absorbed + "，剩余生命 " + state.player.hp + "）。", "red");
    else pushLog("格挡完全挡下了这次攻击（" + absorbed + " 点）。", "green");
    /* 镀甲：受到未格挡的攻击后 -1 层 */
    if (dmg > 0 && b.pst.plating > 0) b.pst.plating--;
    if (b.pst.thorns > 0 && fromIdx >= 0 && b.enemies[fromIdx] && b.enemies[fromIdx].alive) {
      const done = damageEnemy(fromIdx, b.pst.thorns, false, fx);
      pushLog("荆棘反弹 " + done + " 点伤害。", "purple");
      fx.push({ t: "float", who: "e", idx: fromIdx, text: "-" + done, cls: "dmg" });
      if (!b.enemies[fromIdx].alive) fx.push({ t: "die", idx: fromIdx });
    }
    return dmg;
  }
  function strikesInBattle() {
    const b = state.battle;
    function cnt(arr) { return arr.filter(function (c) { return c.id === C_STRIKE; }).length; }
    return cnt(b.draw) + cnt(b.hand) + cnt(b.discard) + cnt(b.exhaust);
  }

  /* ---------------- 充能球 ---------------- */
  function channelOrb(type, count, fx) {
    const b = state.battle;
    if (count <= 0) count = 1;
    const made = [];
    for (let k = 0; k < count; k++) {
      let t = type;
      if (t < 0 || t == null) t = 1 + rand(5);
      let slot = -1;
      for (let i = b.orbSlots - 1; i >= 0; i--) {           /* 从右往左填充 */
        if (b.orbs[i] === ORB.NONE) { slot = i; break; }
      }
      if (slot < 0) {
        /* 槽位已满：最左侧（最旧）的球被激发掉，其它球整体左移，新球放在最右 */
        const old = b.orbs[0];
        pushLog("充能球已满，" + ORB_NAME[old] + "球被激发。", "purple");
        for (let i = 0; i < b.orbSlots - 1; i++) { b.orbs[i] = b.orbs[i + 1]; b.orbDark[i] = b.orbDark[i + 1]; }
        b.orbs[b.orbSlots - 1] = ORB.NONE;
        b.orbDark[b.orbSlots - 1] = 0;
        slot = b.orbSlots - 1;
        fx.push({ t: "orb", op: "evoke", orb: old, slot: 0, overflow: 1 });
      }
      b.orbs[slot] = t;
      if (t === ORB.DARK) b.orbDark[slot] = 6 + effFocus();
      made.push(slot);
      fx.push({ t: "orb", op: "channel", orb: t, slot: slot });
    }
    if (made.length) pushLog("凝聚了 " + count + " 个充能球（" + ORB_NAME[type > 0 ? type : b.orbs[made[made.length - 1]]] + "）。", "cyan");
    fx.push({ t: "cast", who: "p", text: "凝聚充能球" });
  }
  function evokeRightmost(fx) {
    const b = state.battle;
    let slot = -1;
    for (let i = b.orbSlots - 1; i >= 0; i--) if (b.orbs[i] !== ORB.NONE) { slot = i; break; }
    if (slot < 0) { pushLog("没有可以激发的充能球。", "dim"); return; }
    const t = b.orbs[slot], f = effFocus();
    fx.push({ t: "orb", op: "evoke", orb: t, slot: slot });
    switch (t) {
      case ORB.LIGHTNING: {
        const alive = aliveIdxList();
        if (alive.length) {
          const idx = alive[rand(alive.length)];
          const done = damageEnemy(idx, 8 + f, false, fx);
          pushLog("闪电激发：" + ENEMIES[b.enemies[idx].defId].n + " 受到 " + done + " 点伤害。", "gold");
          fx.push({ t: "impact", who: "e", idx: idx, dmg: done, blocked: 0 });
          if (!b.enemies[idx].alive) fx.push({ t: "die", idx: idx });
        }
        break;
      }
      case ORB.FROST: {
        const got = gainBlock(5 + f, fx);
        pushLog("冰霜激发：获得 " + got + " 点格挡。", "blue");
        break;
      }
      case ORB.DARK: {
        let best = -1;
        for (const i of aliveIdxList()) if (best < 0 || b.enemies[i].hp < b.enemies[best].hp) best = i;
        if (best >= 0) {
          const done = damageEnemy(best, b.orbDark[slot], false, fx);
          pushLog("黑暗激发：" + ENEMIES[b.enemies[best].defId].n + " 受到 " + done + " 点伤害。", "purple");
          fx.push({ t: "impact", who: "e", idx: best, dmg: done, blocked: 0 });
          if (!b.enemies[best].alive) fx.push({ t: "die", idx: best });
        }
        break;
      }
      case ORB.PLASMA:
        b.energy += 2;
        pushLog("等离子激发：获得 2 点能量。", "gold");
        break;
      case ORB.GLASS: {
        for (const i of aliveIdxList()) {
          const done = damageEnemy(i, 6 + f, false, fx);
          fx.push({ t: "impact", who: "e", idx: i, dmg: done, blocked: 0 });
          if (!state.battle.enemies[i].alive) fx.push({ t: "die", idx: i });
        }
        pushLog("玻璃激发：对所有敌人造成 " + (6 + f) + " 点伤害。", "gold");
        break;
      }
      default: break;
    }
    b.orbs[slot] = ORB.NONE;
    b.orbDark[slot] = 0;
  }
  /* 回合结束时的充能球被动 */
  function orbPassives(fx) {
    const b = state.battle, f = effFocus();
    for (let i = 0; i < b.orbSlots; i++) {
      const t = b.orbs[i];
      if (t === ORB.NONE) continue;
      if (t === ORB.LIGHTNING) {
        const alive = aliveIdxList();
        if (alive.length) {
          const idx = alive[rand(alive.length)];
          const done = damageEnemy(idx, 3 + f, false, fx);
          pushLog("闪电球：对 " + ENEMIES[b.enemies[idx].defId].n + " 造成 " + done + " 点伤害。", "gold");
          fx.push({ t: "orb", op: "passive", orb: t, slot: i });
          fx.push({ t: "impact", who: "e", idx: idx, dmg: done, blocked: 0 });
          if (!state.battle.enemies[idx].alive) fx.push({ t: "die", idx: idx });
        }
      } else if (t === ORB.FROST) {
        gainBlock(2 + f, fx);
        fx.push({ t: "orb", op: "passive", orb: t, slot: i });
      } else if (t === ORB.DARK) {
        b.orbDark[i] += 6 + f;
      } else if (t === ORB.PLASMA) {
        b.bonusEnergy += 1;
      } else if (t === ORB.GLASS) {
        for (const k of aliveIdxList()) {
          const done = damageEnemy(k, 2, false, fx);
          fx.push({ t: "impact", who: "e", idx: k, dmg: done, blocked: 0 });
          if (!state.battle.enemies[k].alive) fx.push({ t: "die", idx: k });
        }
      }
    }
  }

  /* ---------------- 临时效果 ---------------- */
  function applyTemp(turns) {
    const b = state.battle;
    const expire = b.turn + (turns >= 2 ? 1 : 0);
    if (expire > b.tempExpire) b.tempExpire = expire;
  }

  /* ---------------- 牌堆选择 ---------------- */
  function selPileRef(b, which) {
    if (which === SEL_PILE.HAND) return b.hand;
    if (which === SEL_PILE.DISCARD) return b.discard;
    return b.draw;
  }
  function selPileName(which) {
    if (which === SEL_PILE.HAND) return "手牌";
    if (which === SEL_PILE.DISCARD) return "弃牌堆";
    if (which === SEL_PILE.DRAW_TOP) return "抽牌堆顶";
    return "抽牌堆";
  }
  function cardMatchesFilter(card, filter) {
    const t = cardDef(card).t;
    if (filter === 1) return t === "attack";
    if (filter === 2) return t === "skill";
    if (filter === 3) return t === "power";
    if (filter === 4) return t !== "attack";
    return true;
  }
  function buildSelPool(b, sel) {
    const p = selPileRef(b, sel.pile);
    sel.pool = [];
    if (sel.pile === SEL_PILE.DRAW_TOP) {
      const limit = Math.min(p.length, Math.max(1, sel.times));
      for (let k = 0; k < limit; k++) {          /* 数组尾部是牌堆顶，从顶端往下取 */
        const i = p.length - 1 - k;
        if (cardMatchesFilter(p[i], sel.filter)) sel.pool.push(i);
      }
    } else {
      for (let i = 0; i < p.length; i++) if (cardMatchesFilter(p[i], sel.filter)) sel.pool.push(i);
    }
  }
  function endSelection(b) { b.sel = null; }

  /* 把选中的牌执行对应操作；choice = sel.pool 的下标 */
  function applySelection(b, sel, choice, fx) {
    const p = selPileRef(b, sel.pile);
    const idx = sel.pool[choice];
    if (idx == null || !p[idx]) return false;
    const c = p[idx];
    p.splice(idx, 1);
    switch (sel.op) {
      case SEL_OP.ADD_HAND:
        if (b.hand.length >= MAX_HAND) { b.discard.push(c); pushLog("手牌已满，" + cardName(c) + " 进入弃牌堆。", "dim"); }
        else { b.hand.push(c); pushLog(cardName(c) + " 加入手牌。", "green"); }
        break;
      case SEL_OP.EXHAUST:
        b.exhaust.push(c);
        pushLog(cardName(c) + " 被消耗。", "dim");
        break;
      case SEL_OP.DRAW_TOP:
        b.draw.push(c);                 /* 数组尾部即牌堆顶 */
        pushLog(cardName(c) + " 放到了抽牌堆顶。", "blue");
        break;
      case SEL_OP.PLAY: {
        const times = sel.times > 0 ? sel.times : 1;
        pushLog("免费打出 " + cardName(c) + "（×" + times + "）。", "cyan");
        for (let k = 0; k < times; k++) playCardFree(c, sel.random ? -1 : firstAlive(), fx);
        break;
      }
      default: {
        b.discard.push(c);
        pushLog("你弃置了 " + cardName(c) + "。", "dim");
        maybeSly(c, fx);
        break;
      }
    }
    sel.count--;
    buildSelPool(b, sel);
    if (sel.count <= 0 || sel.pool.length === 0) endSelection(b);
    return true;
  }
  function setupSelection(s, fx) {
    const b = state.battle;
    if (!s.selectCount) return;
    const sel = {
      active: true, pile: s.selectPile, count: s.selectCount, op: s.selectOp,
      filter: s.selectFilter | 0, times: (s.selectTimes > 0 ? s.selectTimes : 1),
      random: s.selectRandom | 0, pool: []
    };
    buildSelPool(b, sel);
    if (!sel.pool.length) {
      pushLog("（" + selPileName(sel.pile) + "里没有可选的牌）", "dim");
      return;
    }
    if (sel.random) {
      pushLog("随机从" + selPileName(sel.pile) + "中处理 " + sel.count + " 张牌。", "gold");
      while (sel.count > 0 && sel.pool.length > 0) {
        const pick = sel.pool[rand(sel.pool.length)];
        const at = sel.pool.indexOf(pick);
        applySelection(b, sel, at, fx);
        if (!sel.active) break;
      }
      endSelection(b);
      return;
    }
    b.sel = sel;
    pushLog("需要从" + selPileName(sel.pile) + "中选择 " + Math.min(sel.count, sel.pool.length) + " 张牌。", "gold");
    fx.push({ t: "sel" });
  }
  function selPick(choice) {
    const b = state.battle, fx = [];
    if (!b || !b.sel || !b.sel.active) return { ok: false, fx: fx, msg: "现在不需要选牌" };
    const ok = applySelection(b, b.sel, choice, fx);
    if (!ok) return { ok: false, fx: fx, msg: "没有这张牌" };
    if (checkBattleEnd(fx)) return { ok: true, fx: fx };
    return { ok: true, fx: fx };
  }
  function selCancel() {
    const b = state.battle, fx = [];
    if (!b || !b.sel) return { ok: false, fx: fx, msg: "现在不需要选牌" };
    pushLog("（放弃剩余选牌）", "dim");
    endSelection(b);
    return { ok: true, fx: fx };
  }
  function checkBattleEnd(fx) {
    if (state.player.hp <= 0) { finishBattle(false); fx.push({ t: "defeat" }); return true; }
    if (aliveCount() === 0) { finishBattle(true); fx.push({ t: "victory" }); return true; }
    return false;
  }

  /* ---------------- 卡牌结算 ---------------- */
  function cardNeedsTarget(s) {
    if (s.aoe || s.randomTarget) return false;
    return (s.damage | 0) !== 0 || (s.hits | 0) > 1 || !!s.vuln || !!s.weak || !!s.poison ||
           !!s.enemyStrDown || !!s.dmgPerPoisonLayer || !!s.doomApply || !!s.enemyTempStrDown ||
           (!!s.minionStrike && !s.minionStrikeAoe);
  }
  function substituteX(s, x) {
    if (x <= 0) return;
    if (s.damage === -1) s.damage = x;
    if (s.hits === -1) s.hits = x;
    if (s.block === -1) s.block = x;
    if (s.draw === -1) s.draw = x;
    if (s.vuln === -1) s.vuln = x;
    if (s.weak === -1) s.weak = x;
    if (s.poison === -1) s.poison = x;
    if (s.selfStr === -1) s.selfStr = x;
    if (s.selfDex === -1) s.selfDex = x;
    if (s.addCount === -1) s.addCount = x;
    if (s.discardN === -1) s.discardN = x;
  }
  function resolveEffectsOnEnemy(idx, s, fx) {
    const b = state.battle, e = b.enemies[idx];
    if (!e || !e.alive) return;
    const nm = ENEMIES[e.defId].n;
    if (s.dmgPerPoisonLayer) {
      const done = damageEnemy(idx, e.st.poison * s.dmgPerPoisonLayer, true, fx);
      pushLog("剧毒爆发：" + nm + " 受到 " + done + " 点伤害。", "purple");
      fx.push({ t: "impact", who: "e", idx: idx, dmg: done, blocked: 0 });
    }
    if (s.damage > 0 || (s.hits | 0) > 1 || s.swordStrike) {
      const hits = Math.max(1, s.hits | 0);
      let base = s.swordStrike ? (20 + b.forge) : (s.damage || 0);
      if (s.dmgPerStrike) base += strikesInBattle() * s.dmgPerStrike;
      if (s.dmgIfVuln && e.st.vuln > 0) base += s.dmgIfVuln;
      if (s.bonusVsPoisoned && e.st.poison > 0) base += s.bonusVsPoisoned;
      if (s.dmgPerAttackPlayed) base += b.attacksPlayed * s.dmgPerAttackPlayed;
      if (s.swordStrike) {
        pushLog("君王之剑斩出（20 + 铸造 " + b.forge + "）。", "gold");
        fx.push({ t: "sword", idx: idx });
      }
      fx.push({ t: "lunge", who: "p", idx: idx });
      let total = 0;
      for (let h = 0; h < hits && e.alive; h++) {
        const got = damageEnemy(idx, playerAttackValue(base), true, fx);
        total += got;
        fx.push({ t: "impact", who: "e", idx: idx, dmg: got, blocked: 0 });
      }
      pushLog(nm + " 受到 " + total + " 点伤害（生命 " + e.hp + "/" + e.maxHp + "）。", "gold");
      if (!e.alive) fx.push({ t: "die", idx: idx });
    }
    if (e.alive && s.vuln) { e.st.vuln += s.vuln; fx.push({ t: "float", who: "e", idx: idx, text: "易伤+" + s.vuln, cls: "buff" }); }
    if (e.alive && s.weak) { e.st.weak += s.weak; fx.push({ t: "float", who: "e", idx: idx, text: "虚弱+" + s.weak, cls: "buff" }); }
    if (e.alive && s.poison) { e.st.poison += s.poison; fx.push({ t: "float", who: "e", idx: idx, text: "中毒+" + s.poison, cls: "buff" }); }
    if (e.alive && s.enemyStrDown) { e.st.str -= s.enemyStrDown; fx.push({ t: "float", who: "e", idx: idx, text: "力量-" + s.enemyStrDown, cls: "buff" }); }
  }

  /* 一张牌的全部效果；card 已经从手牌里拿出来了 */
  function resolveCard(card, tgt, free, cost, fx) {
    const b = state.battle, def = cardDef(card);
    const s = cardStats(card);
    if (!free) {
      b.energy -= cost;
      const starCost = s.starCost | 0;
      if (starCost > 0 && b.star >= starCost) {
        b.star -= starCost;
        pushLog("消耗 " + starCost + " 点星费（剩余 " + b.star + "）。", "gold");
      }
    }
    if (isXCost(card)) substituteX(s, free ? 0 : cost);
    pushLog("你打出 " + cardName(card) + "：", "cyan");

    if (s.selfDamage > 0) {
      playerLoseHp(s.selfDamage, fx);
      pushLog("你失去 " + s.selfDamage + " 点生命（剩余 " + state.player.hp + "）。", "red");
    }
    if (s.aoe) {
      for (const i of aliveIdxList()) resolveEffectsOnEnemy(i, s, fx);
    } else if (s.randomTarget) {
      const a = aliveIdxList();
      if (a.length) resolveEffectsOnEnemy(a[rand(a.length)], s, fx);
    } else if (tgt != null && tgt >= 0 && tgt < b.enemies.length) {
      resolveEffectsOnEnemy(tgt, s, fx);
    } else {
      const i = firstAlive();
      if (i >= 0) resolveEffectsOnEnemy(i, s, fx);
    }

    if (s.block > 0) {
      const got = gainBlock(s.block, fx);
      pushLog("你获得格挡（当前 " + b.pblock + "）。", "blue");
      fx.push({ t: "float", who: "p", idx: -1, text: "格挡+" + got, cls: "blk" });
    }
    if (s.heal > 0) {
      healPlayer(s.heal);
      pushLog("你回复 " + s.heal + " 点生命（" + state.player.hp + "/" + state.player.maxHp + "）。", "green");
      fx.push({ t: "float", who: "p", idx: -1, text: "+" + s.heal, cls: "good" });
    }
    if (s.maxHpGain > 0) { state.player.maxHp += s.maxHpGain; state.player.hp += s.maxHpGain; }
    if (s.selfStr > 0) { b.pst.str += s.selfStr; pushLog("你获得 " + s.selfStr + " 点力量。", "gold"); fx.push({ t: "float", who: "p", idx: -1, text: "力量+" + s.selfStr, cls: "buff" }); }
    if (s.selfDex > 0) { b.pst.dex += s.selfDex; pushLog("你获得 " + s.selfDex + " 点敏捷。", "gold"); fx.push({ t: "float", who: "p", idx: -1, text: "敏捷+" + s.selfDex, cls: "buff" }); }
    if (s.thorns > 0) { b.pst.thorns += s.thorns; pushLog("你获得 " + s.thorns + " 点荆棘。", "gold"); fx.push({ t: "float", who: "p", idx: -1, text: "荆棘+" + s.thorns, cls: "buff" }); }
    if (s.plating > 0) { b.pst.plating += s.plating; pushLog("你获得 " + s.plating + " 层镀甲（每回合结束获得等量格挡）。", "blue"); fx.push({ t: "float", who: "p", idx: -1, text: "镀甲+" + s.plating, cls: "blk" }); }
    if (s.gainDrawPower > 0) b.pst.extraDraw += s.gainDrawPower;
    if (s.gainEnergyPower > 0) { b.pst.extraEnergy += s.gainEnergyPower; b.energyMax += s.gainEnergyPower; }
    if (s.gainStrPerTurn > 0) b.pst.strPerTurn += s.gainStrPerTurn;
    if (s.gainBlockPerTurn > 0) b.pst.blockPerTurn += s.gainBlockPerTurn;
    if (s.gainRegen > 0) b.pst.regen += s.gainRegen;
    if (s.energy > 0) { b.energy += s.energy; pushLog("你获得 " + s.energy + " 点能量。", "gold"); }
    if (s.starGain > 0) {
      b.star += s.starGain;
      pushLog("获得 " + s.starGain + " 点星费（当前 " + b.star + "）。", "gold");
      fx.push({ t: "star", value: b.star });
    }
    /* ---- 充能球 ---- */
    if ((s.channelCount | 0) > 0) channelOrb(s.channelOrb, s.channelCount, fx);
    for (let i = 0; i < (s.evokeCount | 0); i++) evokeRightmost(fx);
    if (s.focusGain > 0) { b.focus += s.focusGain; pushLog("获得 " + s.focusGain + " 点集中（当前 " + b.focus + "）。", "cyan"); fx.push({ t: "float", who: "p", idx: -1, text: "集中+" + s.focusGain, cls: "buff" }); }
    if (s.orbSlots > 0) { b.orbSlots = clampInt(b.orbSlots + s.orbSlots, 1, MAX_ORBS); pushLog("充能球槽位增加到 " + b.orbSlots + " 个。", "cyan"); }
    /* ---- 随从（大脚） ---- */
    if (s.summonHp > 0) {
      b.minionMax += s.summonHp;
      b.minion += s.summonHp;
      pushLog("召唤大脚（生命 " + b.minion + "/" + b.minionMax + "）。", "green");
      fx.push({ t: "minion", op: "summon", hp: b.minion, max: b.minionMax });
    }
    if (s.minionStrike > 0) {
      if (s.minionStrikeAoe) {
        for (const i of aliveIdxList()) {
          const done = damageEnemy(i, s.minionStrike, false, fx);
          fx.push({ t: "impact", who: "e", idx: i, dmg: done, blocked: 0 });
        }
        pushLog("大脚对所有敌人造成 " + s.minionStrike + " 点伤害。", "gold");
      } else {
        let i = (tgt != null && tgt >= 0 && b.enemies[tgt] && b.enemies[tgt].alive) ? tgt : firstAlive();
        if (i >= 0) {
          const done = damageEnemy(i, s.minionStrike, false, fx);
          fx.push({ t: "impact", who: "e", idx: i, dmg: done, blocked: 0 });
          pushLog("大脚对 " + ENEMIES[b.enemies[i].defId].n + " 造成 " + done + " 点伤害。", "gold");
        }
      }
      for (const k of aliveIdxList()) { /* 死亡动画在下面统一处理 */ }
      for (let k = 0; k < b.enemies.length; k++) if (!b.enemies[k].alive) fx.push({ t: "die", idx: k });
      fx.push({ t: "minion", op: "attack" });
    }
    if (s.minionHeal > 0 && b.minionMax > 0) {
      const before = b.minion;
      b.minion = Math.min(b.minionMax, b.minion + s.minionHeal);
      pushLog("大脚回复 " + (b.minion - before) + " 点生命（" + b.minion + "/" + b.minionMax + "）。", "green");
      fx.push({ t: "minion", op: "heal", hp: b.minion, max: b.minionMax });
    }
    /* ---- 铸造（君王之剑） ---- */
    if (s.forgeGain > 0) {
      b.forge += s.forgeGain;
      pushLog("铸造 +" + s.forgeGain + "（君王之剑：" + b.forge + "）。", "gold");
      fx.push({ t: "forge", value: b.forge });
    }
    /* ---- 恶兆 ---- */
    if (s.doomApply > 0) {
      const list = s.aoe ? aliveIdxList()
        : ((tgt != null && tgt >= 0 && b.enemies[tgt] && b.enemies[tgt].alive) ? [tgt] : aliveIdxList().slice(0, 1));
      for (const i of list) {
        b.enemies[i].st.doom += s.doomApply;
        pushLog("对 " + ENEMIES[b.enemies[i].defId].n + " 施加 " + s.doomApply + " 层恶兆。", "purple");
        fx.push({ t: "doom", idx: i, value: b.enemies[i].st.doom });
      }
    }
    /* ---- 临时效果 ---- */
    if (s.tempStr) { b.tempStr += s.tempStr; applyTemp(s.tempTurns); pushLog("临时获得 " + s.tempStr + " 点力量。", "gold"); fx.push({ t: "float", who: "p", idx: -1, text: "力量+" + s.tempStr, cls: "buff" }); }
    if (s.tempDex) { b.tempDex += s.tempDex; applyTemp(s.tempTurns); pushLog("临时获得 " + s.tempDex + " 点敏捷。", "gold"); }
    if (s.tempFocus) { b.tempFocus += s.tempFocus; applyTemp(s.tempTurns); pushLog("临时获得 " + s.tempFocus + " 点集中。", "cyan"); }
    if (s.tempBlock) { const got = gainBlock(s.tempBlock, fx); pushLog("临时获得格挡（当前 " + b.pblock + "）。", "blue"); fx.push({ t: "float", who: "p", idx: -1, text: "格挡+" + got, cls: "blk" }); }
    if (s.enemyTempStrDown && tgt != null && tgt >= 0 && b.enemies[tgt]) {
      b.enemies[tgt].st.tempStr += s.enemyTempStrDown;
      applyTemp(1);
      pushLog(ENEMIES[b.enemies[tgt].defId].n + " 本回合失去 " + s.enemyTempStrDown + " 点力量。", "purple");
      fx.push({ t: "float", who: "e", idx: tgt, text: "力量-" + s.enemyTempStrDown, cls: "buff" });
    }
    if (s.retainHandTurn) { b.retainHand = 1; applyTemp(1); pushLog("本回合结束时保留你的手牌。", "blue"); }
    if (s.freePlayTurn) { b.freePlay = 1; applyTemp(1); pushLog("本回合打出的牌免费。", "gold"); }
    if (s.nextTurnDraw) { b.nextDraw += s.nextTurnDraw; pushLog("下回合额外抽 " + s.nextTurnDraw + " 张牌。", "green"); }
    if (s.exhaustSkills) { b.exhaustSkills = 1; pushLog("之后打出的技能牌都会被消耗。", "purple"); }
    if (s.skillsFree) { b.skillsFree = 1; pushLog("技能牌的费用变为 0。", "gold"); }
    if (s.gainPotion) {
      const id = randomPotionId();
      if (addPotion(id)) pushLog("获得药水：" + POTIONS[id].n + "。", "green");
      else pushLog("药水带已满，" + POTIONS[id].n + " 被丢掉了。", "dim");
    }

    if (def.t === "attack") b.attacksPlayed++;
    b.cardsPlayed++;

    /* 加入手牌类效果（小刀 / 随机无色牌 / 随机攻击牌） */
    if (s.addKind && s.addCount > 0) {
      let added = 0;
      for (let i = 0; i < s.addCount; i++) {
        let id = -1;
        if (s.addKind === 1) id = s.addCard != null ? s.addCard : -1;
        else if (s.addKind === 2) id = randomColorless();
        else if (s.addKind === 3) id = randomAttackOf();
        if (id < 0 || b.hand.length >= MAX_HAND) continue;
        b.hand.push({ id: id, up: 0 });
        added++;
      }
      if (added > 0) pushLog(added + " 张牌加入了你的手牌。", "green");
      else pushLog("（没有牌可以加入手牌）", "dim");
    }
    /* 弃牌类效果 */
    if (s.discardHand) {
      const n = b.hand.length;
      discardHand(fx);
      if (n) pushLog("你丢弃了全部手牌（" + n + " 张）。", "dim");
    } else if (s.discardN > 0) {
      const n = Math.min(s.discardN, b.hand.length);
      discardRandom(n, fx);
      if (n) pushLog("你随机丢弃了 " + n + " 张牌。", "dim");
    }
    /* 牌的去向 */
    if (s.exhaust || def.t === "power" || (cardKeywords(card) & KW.EXHAUST) ||
        (b.exhaustSkills && def.t === "skill")) {
      b.exhaust.push(card);
    } else {
      if (s.returnToHandNext) { card.rth = 1; pushLog(cardName(card) + " 会在下回合回到你的手牌。", "blue"); }
      b.discard.push(card);
    }
    /* 选牌 / 抽牌 */
    setupSelection(s, fx);
    if (s.draw > 0) drawCards(s.draw, fx);
  }

  function playCard(handIdx, targetIdx) {
    const b = state.battle, fx = [];
    if (!b || b.over) return { ok: false, fx: fx, msg: "战斗已经结束了" };
    if (b.sel && b.sel.active) return { ok: false, fx: fx, msg: "先完成上面的选牌" };
    const card = b.hand[handIdx];
    if (!card) return { ok: false, fx: fx, msg: "没有这张手牌" };
    const def = cardDef(card), s0 = cardStats(card);
    if (cardKeywords(card) & KW.UNPLAYABLE) return { ok: false, fx: fx, msg: cardName(card) + " 无法打出" };
    const free = !!(b.freePlay || (b.skillsFree && def.t === "skill"));
    const xcost = isXCost(card);
    const cost = free ? 0 : (xcost ? b.energy : cardCost(card));
    if (!free && cost > b.energy) return { ok: false, fx: fx, msg: "能量不足（需要 " + cost + "，当前 " + b.energy + "）" };
    const starCost = s0.starCost | 0;
    if (starCost > 0 && b.star < starCost) return { ok: false, fx: fx, msg: "星费不足（需要 " + starCost + "，当前 " + b.star + "）" };
    let tgt = targetIdx;
    if (cardNeedsTarget(s0) && !s0.randomTarget) {
      if (tgt == null || tgt < 0 || !b.enemies[tgt] || !b.enemies[tgt].alive) tgt = firstAlive();
      if (tgt < 0) return { ok: false, fx: fx, msg: "没有可以指定的目标" };
    }
    b.hand.splice(handIdx, 1);
    resolveCard(card, tgt, free, cost, fx);
    if (!(b.sel && b.sel.active)) checkBattleEnd(fx);
    return { ok: true, fx: fx };
  }
  /* 免费打出（奇巧 / 选牌重复打出 / 随机打出） */
  function playCardFree(card, target, fx) {
    const b = state.battle;
    if (!b || b.over) return;
    const def = cardDef(card), s0 = cardStats(card);
    if (cardKeywords(card) & KW.UNPLAYABLE) { b.discard.push(card); return; }
    let tgt = target;
    if (cardNeedsTarget(s0) && !s0.randomTarget) {
      if (tgt == null || tgt < 0 || !b.enemies[tgt] || !b.enemies[tgt].alive) tgt = firstAlive();
    }
    resolveCard(card, tgt, true, 0, fx);
  }

  /* 随机一张无色牌 / 攻击牌（用于「加入手牌」类效果） */
  function randomColorless() {
    const pool = [];
    for (let i = 0; i < CARDS.length; i++) {
      if ((CARDS[i].o & 31) === 31 && canBeGained(i)) pool.push(i);
    }
    return pool.length ? pickOne(pool) : -1;
  }
  function randomAttackOf() {
    const pool = [];
    for (let i = 0; i < CARDS.length; i++) {
      if (CARDS[i].t !== "attack") continue;
      if (!(CARDS[i].o & (1 << state.charId))) continue;
      if (!canBeGained(i)) continue;
      pool.push(i);
    }
    return pool.length ? pickOne(pool) : -1;
  }

  /* ---------------- 敌人行动 ---------------- */
  function applyDebuffToPlayer(m, fx) {
    const p = state.battle.pst;
    if (m.vuln) { p.vuln += m.vuln; pushLog("你获得 " + m.vuln + " 层易伤。", "red"); fx.push({ t: "float", who: "p", idx: -1, text: "易伤+" + m.vuln, cls: "dmg" }); }
    if (m.weak) { p.weak += m.weak; pushLog("你获得 " + m.weak + " 层虚弱。", "red"); fx.push({ t: "float", who: "p", idx: -1, text: "虚弱+" + m.weak, cls: "dmg" }); }
    if (m.poison) { p.poison += m.poison; pushLog("你获得 " + m.poison + " 层中毒。", "red"); fx.push({ t: "float", who: "p", idx: -1, text: "中毒+" + m.poison, cls: "dmg" }); }
  }
  function enemyAct(i, fx) {
    const b = state.battle, e = b.enemies[i], def = ENEMIES[e.defId];
    const m = def.mv[e.nextMove % def.mv.length];
    fx.push({ t: "lunge", who: "e", idx: i });
    pushLog("【" + def.n + "】" + enemyIntent(e), "red");
    const hit = function (times) {
      let dmg = (m.dmg || 0) + enemyEffStr(i);
      if (e.st.weak > 0) dmg = Math.floor(dmg * 3 / 4);
      dmg = Math.max(0, dmg);
      for (let k = 0; k < Math.max(1, times); k++) {
        playerTakeAttack(dmg, i, fx);
        if (state.player.hp <= 0) return;
      }
    };
    switch (m.k) {
      case "atk": hit(1); break;
      case "multi": hit(m.hits); break;
      case "block":
        e.block += m.block;
        pushLog("它获得 " + m.block + " 点格挡。", "blue");
        fx.push({ t: "block", who: "e", idx: i, amount: m.block });
        break;
      case "atkBlock":
        e.block += m.block;
        fx.push({ t: "block", who: "e", idx: i, amount: m.block });
        hit(1); break;
      case "atkDebuff": hit(1); applyDebuffToPlayer(m, fx); break;
      case "debuff": case "poison": applyDebuffToPlayer(m, fx); break;
      case "atkPoison": hit(1); applyDebuffToPlayer(m, fx); break;
      case "buff":
        e.st.str += m.strGain;
        pushLog("它的力量提升了 " + m.strGain + " 点（当前 " + e.st.str + "）。", "purple");
        fx.push({ t: "float", who: "e", idx: i, text: "力量+" + m.strGain, cls: "buff" });
        break;
      case "heal": {
        const before = e.hp;
        e.hp = Math.min(e.maxHp, e.hp + m.heal);
        pushLog("它回复了 " + (e.hp - before) + " 点生命（" + e.hp + "/" + e.maxHp + "）。", "green");
        fx.push({ t: "float", who: "e", idx: i, text: "+" + (e.hp - before), cls: "good" });
        break;
      }
      case "steal": {
        const amount = Math.min(state.player.gold, m.gold);
        state.player.gold -= amount;
        e.stolen += amount;
        pushLog("它偷走了 " + amount + " 枚金币（你剩余 " + state.player.gold + "）。", "gold");
        break;
      }
      default: break;
    }
    if (!e.alive) return;
    if (e.st.vuln > 0) e.st.vuln--;
    if (e.st.weak > 0) e.st.weak--;
    if (e.st.frail > 0) e.st.frail--;
    pickEnemyMove(e);
  }

  /* ---------------- 回合流程 ---------------- */
  function beginTurn() {
    const b = state.battle, fx = [];
    b.turn++;
    b.pblock = 0;
    b.energyMax = 3 + b.pst.extraEnergy;
    if (b.turn === 1 && hasRelic(R.CORE)) b.energyMax += 1;
    b.energyMax += b.bonusEnergy;          /* 上回合等离子球攒下的能量 */
    b.bonusEnergy = 0;
    b.energy = b.energyMax;
    b.attacksPlayed = 0;
    b.cardsPlayed = 0;
    if (b.turn === 1 && hasRelic(R.ANCHOR)) { b.pblock += 10; fx.push({ t: "block", who: "p", idx: -1, amount: 10 }); }
    if (b.pst.poison > 0) {
      const d = b.pst.poison;
      state.player.hp = Math.max(0, state.player.hp - d);
      b.pst.poison--;
      pushLog("中毒发作：你失去 " + d + " 点生命（剩余 " + state.player.hp + "）。", "purple");
      fx.push({ t: "impact", who: "p", idx: -1, dmg: d, blocked: 0, self: 1 });
    }
    if (b.pst.strPerTurn > 0) b.pst.str += b.pst.strPerTurn;
    let draws = 5 + b.pst.extraDraw;
    if (b.turn === 1 && hasRelic(R.RING)) draws += 2;
    draws += b.nextDraw;
    b.nextDraw = 0;
    drawCards(draws, fx);
    pullReturning(fx);
    if (b.turn === 1) pullInnate();
    pushLog("—— 第 " + b.turn + " 回合 ——", "gold");
    if (state.player.hp <= 0) { finishBattle(false); fx.push({ t: "defeat" }); }
    return fx;
  }

  function endTurn() {
    const b = state.battle, fx = [];
    if (!b || b.over) return { ok: false, fx: fx, msg: "战斗已经结束了" };
    if (b.sel && b.sel.active) return { ok: false, fx: fx, msg: "先完成上面的选牌" };
    /* 手牌里「回合结束时受伤」的牌 */
    for (let i = 0; i < b.hand.length; i++) {
      const hs = cardStats(b.hand[i]);
      if (hs.handEndDamage > 0) {
        playerLoseHp(hs.handEndDamage, fx);
        pushLog(cardName(b.hand[i]) + " 让你失去 " + hs.handEndDamage + " 点生命。", "red");
      }
    }
    endTurnDiscard();
    if (b.pst.blockPerTurn > 0) gainBlock(b.pst.blockPerTurn, fx);
    if (b.pst.plating > 0) {
      const got = gainBlock(b.pst.plating, fx);
      pushLog("镀甲生效：获得 " + got + " 点格挡。", "blue");
    }
    if (b.pst.regen > 0) healPlayer(b.pst.regen);
    if (b.pst.vuln > 0) b.pst.vuln--;
    if (b.pst.weak > 0) b.pst.weak--;
    if (b.pst.frail > 0) b.pst.frail--;
    orbPassives(fx);
    fx.push({ t: "refresh" });
    if (checkBattleEnd(fx)) return { ok: true, fx: fx };

    pushLog("敌人回合：", "red");
    for (let i = 0; i < b.enemies.length; i++) {
      const e = b.enemies[i];
      if (!e.alive) continue;
      e.block = 0;
      if (e.st.poison > 0) {
        const d = e.st.poison;
        e.hp -= d;
        e.st.poison--;
        pushLog(ENEMIES[e.defId].n + " 中毒发作，失去 " + d + " 点生命。", "purple");
        fx.push({ t: "impact", who: "e", idx: i, dmg: d, blocked: 0 });
        if (e.hp <= 0) { e.hp = 0; e.alive = false; pushLog(ENEMIES[e.defId].n + " 被毒倒了！", "green"); fx.push({ t: "die", idx: i }); }
      }
    }
    if (aliveCount() === 0) { finishBattle(true); fx.push({ t: "refresh" }); fx.push({ t: "victory" }); return { ok: true, fx: fx }; }
    for (let i = 0; i < b.enemies.length; i++) {
      if (!b.enemies[i].alive) continue;
      enemyAct(i, fx);
      if (state.player.hp <= 0) { finishBattle(false); fx.push({ t: "refresh" }); fx.push({ t: "defeat" }); return { ok: true, fx: fx }; }
    }
    if (aliveCount() === 0) { finishBattle(true); fx.push({ t: "refresh" }); fx.push({ t: "victory" }); return { ok: true, fx: fx }; }
    endOfRound(fx);
    if (checkBattleEnd(fx)) return { ok: true, fx: fx };
    const bfx = beginTurn();
    for (let i = 0; i < bfx.length; i++) fx.push(bfx[i]);
    fx.push({ t: "refresh" });
    return { ok: true, fx: fx };
  }
  /* 所有敌人行动完之后：恶兆判定 + 临时效果过期 */
  function endOfRound(fx) {
    const b = state.battle;
    for (let i = 0; i < b.enemies.length; i++) {
      const e = b.enemies[i];
      if (e.alive && e.st.doom > 0 && e.st.doom >= e.hp) {
        e.hp = 0; e.alive = false;
        pushLog("恶兆降临：" + ENEMIES[e.defId].n + " 直接死亡！", "purple");
        fx.push({ t: "doom", idx: i, kill: 1 });
        fx.push({ t: "die", idx: i });
      }
    }
    if (b.tempExpire > 0 && b.turn >= b.tempExpire) {
      if (b.tempStr || b.tempDex || b.tempFocus || b.tempBlock) pushLog("（本回合 / 下回合的临时效果结束）", "dim");
      b.tempStr = 0; b.tempDex = 0; b.tempFocus = 0; b.tempBlock = 0;
      b.tempExpire = 0;
    }
    for (let i = 0; i < b.enemies.length; i++) b.enemies[i].st.tempStr = 0;
    b.retainHand = 0;
    b.freePlay = 0;
  }

  /* ---------------- 药水 ---------------- */
  function usePotion(slot, targetIdx) {
    const b = state.battle, fx = [];
    const id = state.player.potions[slot];
    if (id == null || id < 0) return { ok: false, fx: fx, msg: "这个槽位是空的" };
    if (!b || b.over) return { ok: false, fx: fx, msg: "战斗已经结束了" };
    if (b.sel && b.sel.active) return { ok: false, fx: fx, msg: "先完成上面的选牌" };
    let tgt = targetIdx;
    if (id === P.FIRE || id === P.POISON || id === P.WEAK) {
      if (tgt == null || tgt < 0 || !b.enemies[tgt] || !b.enemies[tgt].alive) tgt = firstAlive();
      if (tgt < 0) return { ok: false, fx: fx, msg: "需要选择一个敌人" };
    }
    pushLog("你使用 " + POTIONS[id].n + "：", "cyan");
    switch (id) {
      case P.HEAL: healPlayer(20); pushLog("回复 20 点生命。", "green"); fx.push({ t: "float", who: "p", idx: -1, text: "+20", cls: "good" }); break;
      case P.STR: b.pst.str += 2; pushLog("力量 +2。", "gold"); fx.push({ t: "float", who: "p", idx: -1, text: "力量+2", cls: "buff" }); break;
      case P.BLOCK: gainBlock(12, fx); pushLog("格挡 +12。", "blue"); fx.push({ t: "float", who: "p", idx: -1, text: "格挡+12", cls: "blk" }); break;
      case P.FIRE: {
        const done = damageEnemy(tgt, 20, true, fx);
        pushLog(ENEMIES[b.enemies[tgt].defId].n + " 受到 " + done + " 点伤害。", "red");
        fx.push({ t: "impact", who: "e", idx: tgt, dmg: done, blocked: 0 });
        if (!b.enemies[tgt].alive) fx.push({ t: "die", idx: tgt });
        break;
      }
      case P.POISON: b.enemies[tgt].st.poison += 6; pushLog("目标获得 6 层中毒。", "purple"); fx.push({ t: "float", who: "e", idx: tgt, text: "中毒+6", cls: "buff" }); break;
      case P.WEAK: b.enemies[tgt].st.weak += 3; b.enemies[tgt].st.vuln += 2; pushLog("目标获得 3 层虚弱与 2 层易伤。", "purple"); fx.push({ t: "float", who: "e", idx: tgt, text: "虚弱+3", cls: "buff" }); break;
      case P.ENERGY: b.energy += 2; pushLog("能量 +2。", "gold"); break;
      default: break;
    }
    state.player.potions[slot] = -1;
    checkBattleEnd(fx);
    return { ok: true, fx: fx };
  }
  function dropPotion(slot) {
    if (!state.player.potions || state.player.potions[slot] < 0) return { ok: false, fx: [] };
    pushLog("你倒掉了 " + POTIONS[state.player.potions[slot]].n + "。", "dim");
    state.player.potions[slot] = -1;
    return { ok: true, fx: [] };
  }

  /* ---------------- 战斗结束与奖励 ---------------- */
  function randomCardOfRarity(rarity) {
    const pool = [];
    for (let i = 0; i < CARDS.length; i++) {
      const d = CARDS[i];
      if (d.r !== rarity) continue;
      if (!(d.o & (1 << state.charId))) continue;
      if (!canBeGained(i)) continue;
      pool.push(i);
    }
    if (!pool.length) return randomGainableCard();
    return pickOne(pool);
  }
  /* 兜底：任何稀有度都抽不到时，至少给一张能获得的牌（绝不静默失败） */
  function randomGainableCard() {
    const pool = [];
    for (let i = 0; i < CARDS.length; i++) {
      const d = CARDS[i];
      if (d.r === "starter") continue;
      if (!(d.o & (1 << state.charId))) continue;
      if (!canBeGained(i)) continue;
      pool.push(i);
    }
    return pool.length ? pickOne(pool) : -1;
  }
  function rollRewards(allowRare) {
    const out = [], used = {};
    let guard = 0;
    while (out.length < 3 && guard++ < 400) {
      const roll = rand(100);
      let rar;
      if (allowRare) rar = roll < 45 ? "common" : (roll < 85 ? "uncommon" : "rare");
      else rar = roll < 62 ? "common" : (roll < 93 ? "uncommon" : "rare");
      const id = randomCardOfRarity(rar);
      if (id < 0 || used[id]) continue;
      used[id] = 1;
      out.push({ id: id, up: 0 });
    }
    return out;
  }
  function finishBattle(win) {
    const b = state.battle;
    if (!b || b.over) return;
    b.over = win ? "win" : "lose";
    b.sel = null;
    if (!win) {
      state.result = "lose";
      state.screen = "over";
      pushLog("你倒下了……", "red");
      clearSave();
      return;
    }
    let gold = 0;
    b.enemies.forEach(function (e) { gold += e.gold + e.stolen; });
    state.player.gold += gold;
    pushLog("战斗胜利！获得 " + gold + " 枚金币。", "green");
    if (b.boss) {
      state.result = "win";
      state.screen = "over";
      clearSave();
      return;
    }
    if (b.elite) {
      const id = randomRelic();
      if (id >= 0) { addRelic(id); pushLog("获得遗物：" + RELICS[id].n + "（" + RELICS[id].d + "）", "gold"); }
    }
    if (hasRelic(R.BLOOD)) { healPlayer(6); pushLog("燃烧之血：回复 6 点生命。", "green"); }
    state.pending = {
      kind: "reward", title: "战利品", text: "选择一张卡牌加入牌组，或者跳过。",
      picks: rollRewards(b.elite ? 1 : 0).map(function (c) { return cardLabel(c); }),
      options: [{ label: "跳过奖励", hint: "不加牌", cls: "btn small" }]
    };
    state.screen = "node";
    save();
  }

  /* ---------------- 节点：休息 / 宝箱 / 商店 / 事件 ---------------- */
  const EVENTS = [
    { title: "亡者之树", text: "一棵挂满吊坠的枯树在风中低语，枝头似乎挂着某个旅人的遗物。",

  function gainRandomCard(rarity) {
    let id = -1;
    if (rarity) id = randomCardOfRarity(rarity);
    if (id < 0) id = randomGainableCard();
    if (id < 0) { pushLog("（没有可以获得的卡牌）", "dim"); return false; }
    state.player.deck.push({ id: id, up: 0 });
    pushLog("获得卡牌：" + CARDS[id].n + "（" + cardDesc({ id: id, up: 0 }) + "）", "green");
    return true;
  }
  function gainRandomPotion() {
    const id = randomPotionId();
    if (addPotion(id)) pushLog("获得药水：" + POTIONS[id].n, "green");
    else pushLog("药水带已满，" + POTIONS[id].n + " 被丢掉了。", "dim");
  }
  function gainRelicLog() {
    const id = randomRelic();
    if (id < 0) { pushLog("你已经收集齐了所有遗物。", "dim"); return false; }
    addRelic(id);
    pushLog("获得遗物：" + RELICS[id].n + "（" + RELICS[id].d + "）", "gold");
